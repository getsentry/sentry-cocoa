# yaml-language-server: $schema=../../schema/xcodegen.schema.json
#
# Minimal macOS sample app using the SentrySPM compile-from-source product.

name: macOS-SwiftUI-SPM
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    path: ../..
fileGroups:
  - macOS-SwiftUI-SPM.yml
options:
  bundleIdPrefix: io.sentry
targets:
  macOS-SwiftUI-SPM:
    type: application
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - Sources
    dependencies:
      - package: Sentry
        product: SentrySPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sentry.macOS-SwiftUI-SPM
        SWIFT_VERSION: "5.0"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: macOS-SwiftUI-SPM
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
    entitlements:
      path: Resources/Entitlements.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "info: sentry-cli - $ERROR"
            fi
          else
            echo "info: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
schemes:
  macOS-SwiftUI-SPM:
    build:
      targets:
        macOS-SwiftUI-SPM: all
    run:
      config: Debug
    archive:
      config: Release
