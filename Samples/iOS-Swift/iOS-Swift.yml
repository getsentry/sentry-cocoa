# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: iOS-Swift
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Test: debug
  TestCI: debug
  Release: release
packages:
  Sentry:
    path: ../..
  SentrySampleShared:
    path: ../SentrySampleShared
options:
  bundleIdPrefix: io.sentry
  defaultSourceDirectoryType: syncedFolder
targets:
  iOS-Swift:
    type: application
    platform: auto
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
          - "**/Info.plist"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/SampleAssets.xcassets
        group: App/Resources
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: iOS-Swift.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        products:
          - SentrySPM
          - SentryObjC
      - package: SentrySampleShared
        product: SentrySampleShared
      - target: iOS-Swift-AppClip
      - target: iOS-Swift-ShareExtension
      - target: iOS-Swift-ActionExtension
      - target: iOS-Swift-IntentExtension
      - target: iOS-Swift-NotificationServiceExtension
    configFiles:
      Debug: App/Configurations/iOS-Swift.xcconfig
      Release: App/Configurations/iOS-Swift.xcconfig
      Test: App/Configurations/iOS-Swift.xcconfig
      TestCI: App/Configurations/iOS-Swift.xcconfig
    postCompileScripts:
      - script: ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: ../Shared/reset-git-info.sh
        name: Reset Git Fields in Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "warning: sentry-cli - $ERROR"
            fi
          else
            echo "warning: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - "${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}"
  iOS-Swift-AppClip:
    type: application.on-demand-install-capable
    platform: auto
    sources:
      # Sources
      - path: AppClip/Sources
        type: group
        group: AppClip
        excludes:
          - "**/.gitkeep"
          - "**/Info.plist"
      # Resources
      - path: AppClip/Resources
        type: group
        group: AppClip
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: AppClip/Configurations
        type: group
        group: AppClip
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        products:
          - SentrySPM
          - SentryObjC
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: AppClip/Configurations/iOS-Swift-AppClip.xcconfig
      Release: AppClip/Configurations/iOS-Swift-AppClip.xcconfig
      Test: AppClip/Configurations/iOS-Swift-AppClip.xcconfig
      TestCI: AppClip/Configurations/iOS-Swift-AppClip.xcconfig
    postCompileScripts:
      - script: ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: ../Shared/reset-git-info.sh
        name: Reset Git Fields in Info.plist
        basedOnDependencyAnalysis: false
  iOS-Swift-UITests:
    type: bundle.ui-testing
    platform: auto
    dependencies:
      - package: SentrySampleShared
        products:
          - SentrySampleShared
          - SentrySampleUITestShared
    sources:
      # Sources
      - path: UITests/Sources
        type: group
        group: UITests
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: UITests/Resources
        type: group
        group: UITests
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: ../../Plans/iOS-Swift_Base.xctestplan
        group: UITests/Configurations
        buildPhase: none
      - path: UITests/Configurations
        type: group
        group: UITests
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
    configFiles:
      Debug: UITests/Configurations/iOS-Swift-UITests.xcconfig
      Release: UITests/Configurations/iOS-Swift-UITests.xcconfig
      Test: UITests/Configurations/iOS-Swift-UITests.xcconfig
      TestCI: UITests/Configurations/iOS-Swift-UITests.xcconfig
  iOS-Swift-ShareExtension:
    type: app-extension
    platform: auto
    sources:
      # Sources
      - path: ShareExtension/Sources
        type: group
        group: ShareExtension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: ShareExtension/Resources
        type: group
        group: ShareExtension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: ShareExtension/Configurations
        type: group
        group: ShareExtension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        products:
          - SentrySPM
          - SentryObjC
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: ShareExtension/Configurations/iOS-Swift-ShareExtension.xcconfig
      Release: ShareExtension/Configurations/iOS-Swift-ShareExtension.xcconfig
      Test: ShareExtension/Configurations/iOS-Swift-ShareExtension.xcconfig
      TestCI: ShareExtension/Configurations/iOS-Swift-ShareExtension.xcconfig
  iOS-Swift-ActionExtension:
    type: app-extension
    platform: auto
    sources:
      # Sources
      - path: ActionExtension/Sources
        type: group
        group: ActionExtension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: ActionExtension/Resources
        type: group
        group: ActionExtension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: ActionExtension/Configurations
        type: group
        group: ActionExtension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        products:
          - SentrySPM
          - SentryObjC
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: ActionExtension/Configurations/iOS-Swift-ActionExtension.xcconfig
      Release: ActionExtension/Configurations/iOS-Swift-ActionExtension.xcconfig
      Test: ActionExtension/Configurations/iOS-Swift-ActionExtension.xcconfig
      TestCI: ActionExtension/Configurations/iOS-Swift-ActionExtension.xcconfig
  iOS-Swift-IntentExtension:
    type: app-extension
    platform: auto
    sources:
      # Sources
      - path: IntentExtension/Sources
        type: group
        group: IntentExtension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: IntentExtension/Resources
        type: group
        group: IntentExtension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: IntentExtension/Configurations
        type: group
        group: IntentExtension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        products:
          - SentrySPM
          - SentryObjC
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: IntentExtension/Configurations/iOS-Swift-IntentExtension.xcconfig
      Release: IntentExtension/Configurations/iOS-Swift-IntentExtension.xcconfig
      Test: IntentExtension/Configurations/iOS-Swift-IntentExtension.xcconfig
      TestCI: IntentExtension/Configurations/iOS-Swift-IntentExtension.xcconfig
  iOS-Swift-NotificationServiceExtension:
    type: app-extension
    platform: auto
    sources:
      # Sources
      - path: NotificationServiceExtension/Sources
        type: group
        group: NotificationServiceExtension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: NotificationServiceExtension/Resources
        type: group
        group: NotificationServiceExtension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: NotificationServiceExtension/Configurations
        type: group
        group: NotificationServiceExtension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        products:
          - SentrySPM
          - SentryObjC
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: NotificationServiceExtension/Configurations/iOS-Swift-NotificationServiceExtension.xcconfig
      Release: NotificationServiceExtension/Configurations/iOS-Swift-NotificationServiceExtension.xcconfig
      Test: NotificationServiceExtension/Configurations/iOS-Swift-NotificationServiceExtension.xcconfig
      TestCI: NotificationServiceExtension/Configurations/iOS-Swift-NotificationServiceExtension.xcconfig
schemes:
  iOS-Swift:
    templates:
      - SampleAppScheme
    build:
      targets:
        iOS-Swift: all
    test:
      config: Test
      testPlans:
        - path: ../../Plans/iOS-Swift_Base.xctestplan
  iOS-Swift-IntentExtension:
    build:
      targets:
        iOS-Swift: all
        iOS-Swift-IntentExtension: all
    run:
      config: Debug
  iOS-Swift-ActionExtension:
    build:
      targets:
        iOS-Swift: all
        iOS-Swift-ActionExtension: all
    run:
      config: Debug
  iOS-Swift-ShareExtension:
    build:
      targets:
        iOS-Swift: all
        iOS-Swift-ShareExtension: all
    run:
      config: Debug
  iOS-Swift-NotificationServiceExtension:
    build:
      targets:
        iOS-Swift-NotificationServiceExtension: all
    run:
      config: Debug
