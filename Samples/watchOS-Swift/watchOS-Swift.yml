# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: watchOS-Swift
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Test: debug
  TestCI: debug
  Release: release
packages:
  Sentry:
    path: ../..
  SentrySampleShared:
    path: ../SentrySampleShared
options:
  bundleIdPrefix: io.sentry
  defaultSourceDirectoryType: syncedFolder
targets:
  watchOS-Swift:
    type: application.watchapp2
    platform: auto
    sources:
      # Resources
      - path: WatchApp/Resources
        type: group
        group: WatchApp
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/SampleAssets.xcassets
        group: WatchApp/Resources
      # Configurations
      - path: WatchApp/Configurations
        type: group
        group: WatchApp
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: WatchApp/Configurations
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: watchOS-Swift.yml
        group: WatchApp/Configurations
        buildPhase: none
    dependencies:
      - target: Extension
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: WatchApp/Configurations/watchOS-Swift-App.xcconfig
      Release: WatchApp/Configurations/watchOS-Swift-App.xcconfig
      Test: WatchApp/Configurations/watchOS-Swift-App.xcconfig
      TestCI: WatchApp/Configurations/watchOS-Swift-App.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "info: sentry-cli - $ERROR"
            fi
          else
            echo "info: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
    entitlements:
      path: WatchApp/Configurations/watchOS-Swift-App.entitlements
      properties: {}
    info:
      path: WatchApp/Configurations/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: watchOS-Swift WatchKit App
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        WKWatchKitApp: true
  Extension:
    type: watchkit2-extension
    platform: auto
    sources:
      # Sources
      - path: Extension/Sources
        type: group
        group: Extension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: Extension/Resources
        type: group
        group: Extension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: Extension/Configurations
        type: group
        group: Extension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: Extension/Configurations/watchOS-Swift-Extension.xcconfig
      Release: Extension/Configurations/watchOS-Swift-Extension.xcconfig
      Test: Extension/Configurations/watchOS-Swift-Extension.xcconfig
      TestCI: Extension/Configurations/watchOS-Swift-Extension.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
    entitlements:
      path: Extension/Configurations/watchOS-Swift-Extension.entitlements
      properties: {}
    info:
      path: Extension/Configurations/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleDisplayName: watchOS-Swift WatchKit Extension
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        NSExtension:
          NSExtensionAttributes:
            WKAppBundleIdentifier: io.sentry.watchOS-Swift.watchkitapp
          NSExtensionPointIdentifier: com.apple.watchkit
        WKExtensionDelegateClassName: $(PRODUCT_MODULE_NAME).ExtensionDelegate
        WKWatchOnly: true
schemes:
  watchOS-Swift WatchKit App:
    templates:
      - SampleAppScheme
    build:
      targets:
        watchOS-Swift: all
