# yaml-language-server: $schema=../../schema/xcodegen.schema.json
#
# macOS command-line tool using SentrySPM with NoUIFramework trait.
# Verifies that the SDK can be used without linking AppKit or UIKit.
#
# NOTE: The `traits` key requires XcodeGen 2.46.0+ (see scripts/.xcodegen-version).
# Older versions silently ignore it, producing a project that links AppKit and
# fails the linkage check. Makefile targets guard against this via
# scripts/check-xcodegen-version.sh.

name: macOS-CLI-Xcode
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    path: ../..
    traits:
      - NoUIFramework
fileGroups:
  - macOS-CLI-Xcode.yml
options:
  bundleIdPrefix: io.sentry
targets:
  macOS-CLI-Xcode:
    type: tool
    platform: macOS
    deploymentTarget: "11.0"
    sources:
      - Sources
    dependencies:
      - package: Sentry
        product: SentrySPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sentry.macOS-CLI-Xcode
        SWIFT_VERSION: "5.0"
schemes:
  macOS-CLI-Xcode:
    build:
      targets:
        macOS-CLI-Xcode: all
    run:
      config: Debug
    archive:
      config: Release
