# yaml-language-server: $schema=../../schema/xcodegen.schema.json
#
# macOS command-line tool using SentrySPM with NoUIFramework trait.
# Verifies that the SDK can be used without linking AppKit or UIKit.
#
# XcodeGen 2.46.0+ can emit package traits (yonaskolb/XcodeGen#1629). This sample
# keeps `NoUIFramework` on the local Sentry package reference so the CLI tool can
# link SentrySPM without AppKit or UIKit.

name: macOS-CLI-Xcode
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    path: ../..
    traits:
      - NoUIFramework
fileGroups:
  - macOS-CLI-Xcode.yml
options:
  bundleIdPrefix: io.sentry
targets:
  macOS-CLI-Xcode:
    type: tool
    platform: macOS
    deploymentTarget: "12.0"
    sources:
      - Sources
    dependencies:
      - package: Sentry
        product: SentrySPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.sentry.macOS-CLI-Xcode
        SWIFT_VERSION: "5.0"
schemes:
  macOS-CLI-Xcode:
    build:
      targets:
        macOS-CLI-Xcode: all
    run:
      config: Debug
    archive:
      config: Release
