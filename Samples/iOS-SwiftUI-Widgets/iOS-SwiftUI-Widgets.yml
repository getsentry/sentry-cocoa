# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: iOS-SwiftUI-Widgets
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    path: ../..
    traits:
      - V10
  SentrySampleShared:
    path: ../SentrySampleShared
    traits:
      - V10
options:
  bundleIdPrefix: io.sentry.sentry-cocoa.samples
  defaultSourceDirectoryType: syncedFolder
targets:
  iOS-SwiftUI-Widgets:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
          - "**/Info.plist"
          - "**/*.entitlements"
      - path: Shared/Data
        type: group
        group: App/Shared
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: iOS-SwiftUI-Widgets.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
      - target: iOS-SwiftUI-Widgets-WidgetExtension
      - target: iOS-SwiftUI-Widgets-LiveActivity
    configFiles:
      Debug: App/Configurations/iOS-SwiftUI-Widgets.xcconfig
      Release: App/Configurations/iOS-SwiftUI-Widgets.xcconfig
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SDK_V10=1
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SDK_V10
  iOS-SwiftUI-Widgets-WidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Sources
      - path: WidgetExtension/Sources
        type: group
        group: WidgetExtension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: WidgetExtension/Resources
        type: group
        group: WidgetExtension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: WidgetExtension/Configurations
        type: group
        group: WidgetExtension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: WidgetExtension/Configurations/iOS-SwiftUI-Widgets-WidgetExtension.xcconfig
      Release: WidgetExtension/Configurations/iOS-SwiftUI-Widgets-WidgetExtension.xcconfig
  iOS-SwiftUI-Widgets-LiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Sources
      - path: LiveActivity/Sources
        type: group
        group: LiveActivity
        excludes:
          - "**/.gitkeep"
      - path: Shared/Data
        type: group
        group: App/Shared
      # Resources
      - path: LiveActivity/Resources
        type: group
        group: LiveActivity
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: LiveActivity/Configurations
        type: group
        group: LiveActivity
        buildPhase: none
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: LiveActivity/Configurations/iOS-SwiftUI-Widgets-LiveActivity.xcconfig
      Release: LiveActivity/Configurations/iOS-SwiftUI-Widgets-LiveActivity.xcconfig
schemes:
  iOS-SwiftUI-Widgets:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
        iOS-SwiftUI-Widgets-LiveActivity: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  iOS-SwiftUI-Widgets-WidgetExtension:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: SampleWidget
  iOS-SwiftUI-Widgets-WidgetControl:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: SampleWidgetControl
  iOS-SwiftUI-Widgets-LiveActivity:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
        iOS-SwiftUI-Widgets-LiveActivity: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
