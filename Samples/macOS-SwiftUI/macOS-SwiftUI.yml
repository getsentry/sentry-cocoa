# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: macOS-SwiftUI
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Test: debug
  TestCI: debug
  Release: release
packages:
  Sentry:
    path: ../..
  SentrySampleShared:
    path: ../SentrySampleShared
options:
  bundleIdPrefix: io.sentry
  defaultSourceDirectoryType: syncedFolder
targets:
  macOS-SwiftUI:
    type: application
    platform: auto
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
          - "**/Info.plist"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/SampleAssets.xcassets
        group: App/Resources
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: macOS-SwiftUI.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: App/Configurations/macOS-SwiftUI.xcconfig
      Release: App/Configurations/macOS-SwiftUI.xcconfig
      Test: App/Configurations/macOS-SwiftUI.xcconfig
      TestCI: App/Configurations/macOS-SwiftUI.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "info: sentry-cli - $ERROR"
            fi
          else
            echo "info: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
    entitlements:
      path: App/Configurations/macOS-SwiftUI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    info:
      path: App/Configurations/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIconFile: ""
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2020 Sentry. All rights reserved.
        NSSupportsAutomaticTermination: true
        NSSupportsSuddenTermination: true
schemes:
  macOS-SwiftUI:
    templates:
      - SampleAppScheme
    build:
      targets:
        macOS-SwiftUI: all
