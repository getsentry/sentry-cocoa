# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: iOS-SwiftUI
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Test: debug
  TestCI: debug
  Release: release
packages:
  Sentry:
    path: ../..
    traits:
      - V10
  SentrySampleShared:
    path: ../SentrySampleShared
    traits:
      - V10
options:
  bundleIdPrefix: io.sentry
  defaultSourceDirectoryType: syncedFolder
targets:
  iOS-SwiftUI:
    type: application
    platform: auto
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/SampleAssets.xcassets
        group: App/Resources
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: iOS-SwiftUI.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: App/Configurations/iOS-SwiftUI.xcconfig
      Release: App/Configurations/iOS-SwiftUI.xcconfig
      Test: App/Configurations/iOS-SwiftUI.xcconfig
      TestCI: App/Configurations/iOS-SwiftUI.xcconfig
    settings:
      base:
        GCC_PREPROCESSOR_DEFINITIONS: $(inherited) SDK_V10=1
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SDK_V10
    postCompileScripts:
      - script: ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
    postBuildScripts:
      - script: ../Shared/reset-git-info.sh
        name: Reset Git Fields in Info.plist
        basedOnDependencyAnalysis: false
  iOS-SwiftUI-UITests:
    type: bundle.ui-testing
    platform: auto
    dependencies:
      - package: SentrySampleShared
        products:
          - SentrySampleShared
          - SentrySampleUITestShared
    sources:
      # Sources
      - path: UITests/Sources
        type: group
        group: UITests
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: UITests/Resources
        type: group
        group: UITests
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: UITests/Configurations
        type: group
        group: UITests
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: ../../Plans/iOS-SwiftUI_Base.xctestplan
        group: UITests/Configurations
        buildPhase: none
    configFiles:
      Debug: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
      Release: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
      Test: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
      TestCI: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SDK_V10
schemes:
  iOS-SwiftUI:
    templates:
      - SampleAppScheme
    build:
      targets:
        iOS-SwiftUI: all
        iOS-SwiftUI-UITests: test
    test:
      config: Test
      testPlans:
        - path: ../../Plans/iOS-SwiftUI_Base.xctestplan
