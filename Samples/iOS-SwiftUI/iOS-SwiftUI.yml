# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: iOS-SwiftUI
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Test: debug
  TestCI: debug
  Release: release
packages:
  Sentry:
    path: ../..
  SentrySampleShared:
    path: ../SentrySampleShared
options:
  bundleIdPrefix: io.sentry
  defaultSourceDirectoryType: syncedFolder
targets:
  iOS-SwiftUI:
    type: application
    platform: auto
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/SampleAssets.xcassets
        group: App/Resources
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: iOS-SwiftUI.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: App/Configurations/iOS-SwiftUI.xcconfig
      Release: App/Configurations/iOS-SwiftUI.xcconfig
      Test: App/Configurations/iOS-SwiftUI.xcconfig
      TestCI: App/Configurations/iOS-SwiftUI.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "info: sentry-cli - $ERROR"
            fi
          else
            echo "info: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
    entitlements:
      path: App/Configurations/iOS-SwiftUI.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/Configurations/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  iOS-SwiftUI-UITests:
    type: bundle.ui-testing
    platform: auto
    dependencies:
      - package: SentrySampleShared
        products:
          - SentrySampleShared
          - SentrySampleUITestShared
    sources:
      # Sources
      - path: UITests/Sources
        type: group
        group: UITests
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: UITests/Resources
        type: group
        group: UITests
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: UITests/Configurations
        type: group
        group: UITests
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: ../../Plans/iOS-SwiftUI_Base.xctestplan
        group: UITests/Configurations
        buildPhase: none
    configFiles:
      Debug: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
      Release: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
      Test: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
      TestCI: UITests/Configurations/iOS-SwiftUI-UITests.xcconfig
    info:
      path: UITests/Configurations/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
schemes:
  iOS-SwiftUI:
    templates:
      - SampleAppScheme
    build:
      targets:
        iOS-SwiftUI: all
        iOS-SwiftUI-UITests: test
    test:
      config: Test
      testPlans:
        - path: ../../Plans/iOS-SwiftUI_Base.xctestplan
