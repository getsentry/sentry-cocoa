# yaml-language-server: $schema=../../schema/xcodegen.schema.json
#
# This sample uses Sentry from Objective-C++ without modules (-fmodules /
# -fcxx-modules). It depends on SentryObjC, the pure ObjC wrapper that exposes
# the full SDK API via #import <SentryObjC.h>.
#
# See README.md in this directory for details.

name: iOS-ObjectiveCpp-NoModules
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    path: ../..
options:
  bundleIdPrefix: io.sentry
targets:
  iOS-ObjectiveCpp-NoModules:
    type: application
    platform: auto
    deploymentTarget: "15.0"
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/SampleAssets.xcassets
        group: App/Resources
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: iOS-ObjectiveCpp-NoModules.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        product: SentryObjC
    configFiles:
      Debug: App/Configurations/iOS-ObjectiveCpp-NoModules.xcconfig
      Release: App/Configurations/iOS-ObjectiveCpp-NoModules.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "info: sentry-cli - $ERROR"
            fi
          else
            echo "info: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
    entitlements:
      path: App/Configurations/iOS-ObjectiveCpp-NoModules.entitlements
      properties: {}
    info:
      path: App/Configurations/Info.plist
      properties:
        CFBundleDevelopmentRegion: $(DEVELOPMENT_LANGUAGE)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: SceneDelegate
                UISceneStoryboardFile: Main
        UILaunchStoryboardName: LaunchScreen
        UIMainStoryboardFile: Main
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  iOS-ObjectiveCpp-NoModules:
    build:
      targets:
        iOS-ObjectiveCpp-NoModules: all
    run:
      config: Debug
    archive:
      config: Release
