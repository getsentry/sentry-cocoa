# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: iOS-SwiftUI-Widgets
include:
  - ../Shared/feature-flags.yml
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
packages:
  Sentry:
    path: ../..
  SentrySampleShared:
    path: ../SentrySampleShared
options:
  bundleIdPrefix: io.sentry.sentry-cocoa.samples
  defaultSourceDirectoryType: syncedFolder
targets:
  iOS-SwiftUI-Widgets:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: App/Resources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
          - "**/Info.plist"
          - "**/*.entitlements"
      - path: Shared/Data
        type: group
        group: App/Shared
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: iOS-SwiftUI-Widgets.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
      - target: iOS-SwiftUI-Widgets-WidgetExtension
      - target: iOS-SwiftUI-Widgets-LiveActivity
    configFiles:
      Debug: App/Configurations/iOS-SwiftUI-Widgets.xcconfig
      Release: App/Configurations/iOS-SwiftUI-Widgets.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - script: |
          # This script is responsible for uploading debug symbols and source context for Sentry.
          if [[ "$(uname -m)" == arm64 ]]; then
            export PATH="/opt/homebrew/bin:$PATH"
          fi

          if which sentry-cli >/dev/null; then
            export SENTRY_ORG=sentry-sdks
            export SENTRY_PROJECT=sentry-cocoa
            ERROR=$(sentry-cli debug-files upload --include-sources "$DWARF_DSYM_FOLDER_PATH" 2>&1 >/dev/null)
            if [ ! $? -eq 0 ]; then
              echo "info: sentry-cli - $ERROR"
            fi
          else
            echo "info: sentry-cli not installed, download from https://github.com/getsentry/sentry-cli/releases"
          fi
        name: Upload Debug Symbols to Sentry
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
    entitlements:
      path: App/Configurations/Entitlements.entitlements
      properties:
        aps-environment: development
    info:
      path: App/Configurations/Info.plist
      properties:
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
  iOS-SwiftUI-Widgets-WidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Sources
      - path: WidgetExtension/Sources
        type: group
        group: WidgetExtension
        excludes:
          - "**/.gitkeep"
      # Resources
      - path: WidgetExtension/Resources
        type: group
        group: WidgetExtension
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: WidgetExtension/Configurations
        type: group
        group: WidgetExtension
        buildPhase: none
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: WidgetExtension/Configurations/iOS-SwiftUI-Widgets-WidgetExtension.xcconfig
      Release: WidgetExtension/Configurations/iOS-SwiftUI-Widgets-WidgetExtension.xcconfig
    entitlements:
      path: WidgetExtension/Configurations/Entitlements.entitlements
      properties: {}
    info:
      path: WidgetExtension/Configurations/Info.plist
      properties:
        CFBundleDisplayName: iOS-SwiftUI-Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSHumanReadableCopyright: ""
  iOS-SwiftUI-Widgets-LiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      # Sources
      - path: LiveActivity/Sources
        type: group
        group: LiveActivity
        excludes:
          - "**/.gitkeep"
      - path: Shared/Data
        type: group
        group: App/Shared
      # Resources
      - path: LiveActivity/Resources
        type: group
        group: LiveActivity
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: LiveActivity/Configurations
        type: group
        group: LiveActivity
        buildPhase: none
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: Sentry
        product: SentrySPM
      - package: SentrySampleShared
        product: SentrySampleShared
    configFiles:
      Debug: LiveActivity/Configurations/iOS-SwiftUI-Widgets-LiveActivity.xcconfig
      Release: LiveActivity/Configurations/iOS-SwiftUI-Widgets-LiveActivity.xcconfig
    entitlements:
      path: LiveActivity/Configurations/Entitlements.entitlements
      properties: {}
    info:
      path: LiveActivity/Configurations/Info.plist
      properties:
        CFBundleDisplayName: Live Activity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSHumanReadableCopyright: ""
schemes:
  iOS-SwiftUI-Widgets:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
        iOS-SwiftUI-Widgets-LiveActivity: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
  iOS-SwiftUI-Widgets-WidgetExtension:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: SampleWidget
  iOS-SwiftUI-Widgets-WidgetControl:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
    run:
      config: Debug
      askForAppToLaunch: true
      environmentVariables:
        _XCWidgetKind: SampleWidgetControl
  iOS-SwiftUI-Widgets-LiveActivity:
    build:
      targets:
        iOS-SwiftUI-Widgets: all
        iOS-SwiftUI-Widgets-WidgetExtension: all
        iOS-SwiftUI-Widgets-LiveActivity: all
    run:
      config: Debug
    profile:
      config: Release
    archive:
      config: Release
