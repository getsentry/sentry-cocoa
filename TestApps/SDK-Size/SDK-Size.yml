# yaml-language-server: $schema=../../schema/xcodegen.schema.json

name: SDK-Size
createIntermediateGroups: true
generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
projectReferences:
  Sentry:
    path: ../../Sentry.xcodeproj
options:
  bundleIdPrefix: io.sentry
  defaultSourceDirectoryType: syncedFolder
targets:
  SDK-Size:
    type: application
    platform: auto
    sources:
      # Sources
      - path: App/Sources
        type: group
        group: App
        excludes:
          - "**/.gitkeep"
      # Configurations
      - path: App/Configurations
        type: group
        group: App
        buildPhase: none
        excludes:
          - "**/.gitkeep"
      - path: ../Shared/Config
        type: group
        group: App/Configurations
        buildPhase: none
      - path: SDK-Size.yml
        group: App/Configurations
        buildPhase: none
    dependencies:
      - target: Sentry/Sentry
    configFiles:
      Debug: App/Configurations/SDK-Size.xcconfig
      Release: App/Configurations/SDK-Size.xcconfig
    postBuildScripts:
      - script: INFOPLIST_FILE="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}" ../Shared/inject-git-info.sh
        name: Inject Git Information into Info.plist
        basedOnDependencyAnalysis: false
      - name: Strip Debug Symbols
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SYMBOL_STRIPPING_INPUT)
        script: |
          set -eu

          if [ "${CONFIGURATION}" != "Release" ]; then
            echo "Skipping symbol stripping for ${CONFIGURATION} build."
            exit 0
          fi

          # The dSYM input ensures symbolication data is generated before stripping.
          echo "Stripping main binary: ${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"
          /usr/bin/strip -rSTx "${TARGET_BUILD_DIR}/${EXECUTABLE_PATH}"

          for framework in "${TARGET_BUILD_DIR}/${FRAMEWORKS_FOLDER_PATH}"/*.framework; do
            framework_name="${framework##*/}"
            binary="${framework}/${framework_name%.framework}"
            if [ -f "${binary}" ] && ! /usr/bin/codesign -v -R="anchor apple" "${binary}" >/dev/null 2>&1; then
              echo "Stripping framework binary: ${binary}"
              /usr/bin/strip -rSTx "${binary}"
            fi
          done
    entitlements:
      path: App/Configurations/SDK-Size.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/Configurations/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        GIT_BRANCH: <branch>
        GIT_COMMIT_HASH: <sha>
        GIT_STATUS_CLEAN: <status>
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
schemes:
  SDK-Size:
    templates:
      - TestAppScheme
    build:
      targets:
        SDK-Size: all
