name: Run Full CI Workflow
on:
  workflow_call:
    outputs:
      run_ci:
        description: Whether CI should run for this event
        value: ${{ jobs.run-full-ci-gate.outputs.run_ci }}

jobs:
  run-full-ci-gate:
    name: Check CI eligibility
    runs-on: ubuntu-latest
    outputs:
      run_ci: ${{ steps.check-ci.outputs.run_ci }}
    steps:
      - name: Check PR state and CI labels
        id: check-ci
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pullRequestEvents = ['pull_request', 'pull_request_target', 'pull_request_review'];
            if (!pullRequestEvents.includes(context.eventName)) {
              core.setOutput('run_ci', 'true');
              core.info('Not a PR. Proceeding with CI.');
              return;
            }

            // Read current state so reruns reflect draft and label changes.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });
            const labels = pullRequest.labels.map(label => label.name);
            const runCI = pullRequest.draft
              ? labels.includes('run-full-ci')
              : !labels.includes('run-no-ci');

            core.setOutput('run_ci', runCI.toString());
            core.info(runCI ? 'Proceeding with CI.' : 'Skipping CI for this PR.');
