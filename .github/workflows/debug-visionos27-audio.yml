# TEMPORARY: debugging the visionOS 27 simulator backboardd crash loop on CI. Do not merge.
name: Debug visionOS 27 Audio

on:
  pull_request:
    paths:
      - ".github/workflows/debug-visionos27-audio.yml"
      - "scripts/ci-debug-visionos27-audio.sh"

# Pull-request-only workflow, so only the latest commit matters and older runs are cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe ${{ matrix.variant }}
    runs-on: ${{ fromJSON('["bitrise_pool_name:tahoe-xl"]') }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - restart-coreaudiod-preboot
          - tcc-grant
          - click-allow
          - click-dont-allow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "27"

      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: visionOS

      - name: Ensure required runtime is loaded
        timeout-minutes: 5
        env:
          OS_VERSION: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
        run: ./scripts/ci-ensure-runtime-loaded.sh --os-version "$OS_VERSION" --platform visionOS

      - name: Probe backboardd
        env:
          VARIANT: ${{ matrix.variant }}
          OS_VERSION: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
        run: |
          ./scripts/ci-debug-visionos27-audio.sh \
            --variant "$VARIANT" \
            --os-version "$OS_VERSION" \
            --device "$DEVICE_NAME" \
            --output-dir visionos27-audio-debug

      - name: Archiving diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ always() }}
        with:
          name: visionos27-audio-debug-${{ matrix.variant }}
          path: visionos27-audio-debug/**
