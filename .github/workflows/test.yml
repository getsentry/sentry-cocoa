name: Test
on:
  push:
    branches:
      - main
      - v8.x
      - release/**

  pull_request:
    types: [
      opened,
      synchronize,
      reopened,
      labeled,
      unlabeled,
      ready_for_review,
      converted_to_draft,
    ]

# Concurrency configuration:
# - We use workflow-specific concurrency groups to allow independent test runs across different workflows
#   while preventing multiple runs of the same test suite on the same branch/commit.
# - For pull requests, we cancel in-progress runs when new commits are pushed to save CI resources
#   and provide faster feedback on the latest changes.
# - For main branch pushes and scheduled runs, we never cancel in-progress runs to ensure the complete
#   test suite always finishes, maintaining the integrity of our main branch quality gates.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-full-ci-gate:
    name: CI eligibility
    uses: ./.github/workflows/run-full-ci-workflow.yml

  # This job detects if the PR contains changes that require running unit tests.
  # If yes, the job will output a flag that will be used by the next job to run the unit tests.
  # If no, the job will output a flag that will be used by the next job to skip running the unit tests.
  # At the end of this workflow, we run a check that validates that either all unit tests passed or were
  # called unit-tests-required-check.
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    needs: run-full-ci-gate
    if: needs.run-full-ci-gate.outputs.run_ci == 'true'
    # Map a step output to a job output
    outputs:
      run_unit_tests_for_prs: ${{ steps.changes.outputs.run_unit_tests_for_prs }}
      run_distribution_tests_for_prs: ${{ steps.changes.outputs.run_distribution_tests_for_prs }}
      run_thread_inspection_harness_for_prs: ${{ steps.changes.outputs.run_thread_inspection_harness_for_prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build-test-server:
    name: Build test server
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_unit_tests_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache for Test Server
        id: cache_test_server
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ./test-server/.build
          key: test-server-${{ hashFiles('test-server/**') }}-arm64
          restore-keys: |
            test-server-

      - name: Build Test Server
        working-directory: test-server
        run: |
          set -o pipefail
          make release-arm64 2>&1 | tee test-server-build.log

      - name: Archiving DerivedData
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-server
          path: |
            ./test-server/test-server-exec

      - name: Archiving Raw Test Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: test-server-build-log
          path: |
            test-server/test-server-build.log

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()

  distribution-tests:
    name: SPM Tests
    runs-on: ["bitrise_pool_name:tahoe"]
    # Don't run this on release branches, cause the SPM Package.swift points to the unreleased versions.
    # Also, skip when PR changes don't require running tests to save CI time.
    if: startsWith(github.ref, 'refs/heads/release/') == false && (github.event_name != 'pull_request' || needs.files-changed.outputs.run_distribution_tests_for_prs == 'true')
    needs: files-changed
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      - name: Select Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: iOS
      - name: Ensure required runtime is loaded
        # Ideally we will not need this, but CI sometimes is failing to load some runtimes, this will ensure they are loaded
        timeout-minutes: 5 # 5 minutes timeout
        env:
          OS_VERSION: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          PLATFORM: "iOS"
        run: ./scripts/ci-ensure-runtime-loaded.sh --os-version "$OS_VERSION" --platform "$PLATFORM"

      - name: Run package tests
        env:
          IOS_SIMULATOR_OS: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
        run: |
          make test-ios \
            TEST_INCLUDE_DISTRIBUTION=true \
            TEST_DERIVED_DATA="$RUNNER_TEMP/distribution-derived-data" 2>&1 | tee raw-test-output-distribution.log
      - name: Upload Distribution Test Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-test-output-distribution
          path: |
            raw-test-output-distribution.log
            raw-prepare-package-output.log
            raw-build-for-testing-output.log
            raw-test-output.log

      - name: Archiving Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: result-bundle-distribution
          path: ${{ runner.temp }}/results.xcresult

  # This matrix runs only the unit tests requiring the test server.
  # We do this to speed up the other unit test jobs and to avoid running the
  # test server with potential side effects in GH actions for all unit tests.
  # We don't run this matrix for all different OS versions, because the chances
  # of a bug solely on a specific OS version is minimal.
  unit-tests-with-test-server:
    name: Unit with Test Server ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_unit_tests_for_prs == 'true'
    needs: [files-changed, build-test-server]
    runs-on: ["bitrise_pool_name:tahoe"]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [macOS, Catalyst]

    steps:
      # === Checkout and independent preparation ===
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: test-server

      - name: Start Test Server
        id: test-server
        background: true
        run: |
          chmod +x test-server-exec
          exec ./test-server-exec serve --port 8081 > test-server/.test-server.log 2>&1

      # === Toolchain and simulator preparation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"

      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: ${{ matrix.platform }}

      - name: Resolve Make target
        id: resolve-make-target
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          case "$PLATFORM" in
            macOS) target=test-macos ;;
            Catalyst) target=test-catalyst ;;
            *)
              echo "::error::Unsupported unit-test platform: $PLATFORM"
              exit 1
              ;;
          esac
          echo "make-target=$target" >> "$GITHUB_OUTPUT"

      - name: Build tests
        id: build_tests
        env:
          MAKE_TARGET: ${{ steps.resolve-make-target.outputs.make-target }}
        run: |
          make "$MAKE_TARGET" \
            TEST_COMMAND=build-for-testing \
            TEST_PLAN=SentrySPM_TestServer_v10

      # A wait control step would wait for server exit, not HTTP readiness.
      - name: Wait for Test Server readiness
        run: |
          for _ in {1..200}; do
            if [ "$(curl --fail --silent --max-time 1 http://localhost:8081/health)" = "OK" ]; then
              exit 0
            fi
            sleep 0.1
          done
          cat test-server/.test-server.log
          echo "::error::Test server failed to become ready"
          exit 1

      - name: Run tests
        env:
          MAKE_TARGET: ${{ steps.resolve-make-target.outputs.make-target }}
        run: |
          make "$MAKE_TARGET" \
            TEST_COMMAND=test-without-building \
            TEST_PLAN=SentrySPM_TestServer_v10

      # Control steps run even after a failure, so the server cannot hold up cleanup.
      - name: Stop Test Server
        cancel: test-server

      # === Artifacts and diagnostics ===
      - name: Archiving Raw Logs
        id: upload-raw-logs
        background: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-output-test-server-${{ matrix.platform }}
          path: |
            raw-prepare-package-output.log
            raw-build-output.log
            raw-build-for-testing-output.log
            raw-test-output.log

      - name: Archiving Test Results
        id: upload-test-results
        background: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: result-bundle-test-server-${{ matrix.platform }}
          path: ${{ runner.temp }}/results.xcresult

      - name: Archiving DerivedData Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.build_tests.outcome == 'failure'
        with:
          name: derived-data-test-server-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/sentry-package-derived-data/Logs/**

      - name: Archiving Crash Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: crash-logs-test-server-${{ matrix.platform }}
          path: |
            ~/Library/Logs/DiagnosticReports/**

      - name: Wait for artifact uploads
        wait: [upload-raw-logs, upload-test-results]

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

      - name: Store screenshot
        uses: ./.github/actions/capture-screenshot
        if: ${{ failure() || cancelled() }}
        with:
          suffix: test-server-${{ matrix.platform }}

  unit-tests:
    name: Unit ${{matrix.name}}
    needs: files-changed
    uses: ./.github/workflows/unit-test-common.yml
    secrets:
      GIT_SSH_PRIVATE_KEY_BASE64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
      GIT_SSH_KEY_PASSPHRASE: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
    with:
      name: ${{matrix.name}}
      runs-on: ${{ matrix.runs-on }}
      timeout: ${{matrix.timeout || 20}}
      should_skip: ${{ github.event_name == 'pull_request' && needs.files-changed.outputs.run_unit_tests_for_prs != 'true' }}
      xcode: ${{matrix.xcode}}
      platform: ${{matrix.platform}}
      device: ${{matrix.device || ''}}
    strategy:
      fail-fast: false
      matrix:
        # watchOS unit tests run in nightly-test.yml to keep the regular CI matrix focused.
        include:
          # iOS 18
          - name: iOS 18 Sentry
            runs-on: sequoia
            xcode: "16"
            platform: "iOS"

          # iOS 26
          - name: iOS 26 Sentry
            runs-on: tahoe
            xcode: "26"
            platform: "iOS"

          # iOS 27
          - name: iOS 27 Sentry
            runs-on: tahoe-27
            xcode: "27"
            platform: "iOS"

          # We don't run the unit tests on macOS 13 cause we run them on all on GH actions available iOS versions.
          # The chance of missing a bug solely on tvOS 16 that doesn't occur on iOS, macOS 12 or macOS 15 is minimal.
          # We are running tests on macOS 15 and later, as there were OS-internal changes introduced in succeeding versions.

          # macOS 15
          - name: macOS 15 Sentry
            runs-on: sequoia
            xcode: "16"
            platform: "macOS"

          # macOS 26
          - name: macOS 26 Sentry
            runs-on: tahoe
            xcode: "26"
            platform: "macOS"

          # macOS 27
          - name: macOS 27 Sentry
            runs-on: xcode-beta # golden gate
            xcode: "27"
            platform: "macOS"

          # Catalyst. We test the latest version, as the risk something breaking on Catalyst and not
          # on an older iOS or macOS version is low.

          # Catalyst 15
          - name: Catalyst 15 Sentry
            runs-on: sequoia
            xcode: "16"
            platform: "Catalyst"

          # Catalyst 26
          - name: Catalyst 26 Sentry
            runs-on: tahoe
            xcode: "26"
            platform: "Catalyst"

          # Catalyst 27
          - name: Catalyst 27 Sentry
            runs-on: xcode-beta
            xcode: "27"
            platform: "Catalyst"

          # We don't run the unit tests on tvOS 16 cause we run them on all on GH actions available iOS versions.
          # The chance of missing a bug solely on tvOS 16 that doesn't occur on iOS, tvOS 15 or tvOS 16 is minimal.
          # tvOS 18
          - name: tvOS 18 Sentry
            runs-on: sequoia
            xcode: "16"
            platform: "tvOS"

          # tvOS 26
          - name: tvOS 26 Sentry
            runs-on: tahoe
            xcode: "26"
            platform: "tvOS"
            device: "Apple TV"

          # tvOS 27
          - name: tvOS 27 Sentry
            runs-on: tahoe-27
            xcode: "27"
            platform: "tvOS"

          # visionOS 26
          - name: visionOS 26 Sentry
            runs-on: tahoe
            xcode: "26"
            platform: "visionOS"
            timeout: 30

          # visionOS 27
          # ci-boot-simulator.sh answers the host's microphone permission prompt for visionOS
          # simulators. Unanswered, it makes the simulator's backboardd crash-loop and the tests
          # take 10 to 60 minutes instead of 4.
          # See https://github.com/getsentry/sentry-cocoa/pull/9644 for the investigation.
          - name: visionOS 27 Sentry
            runs-on: tahoe-xl
            xcode: "27"
            platform: "visionOS"
            timeout: 30

  thread-inspection-harness:
    name: Test Thread Inspection
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_thread_inspection_harness_for_prs == 'true'
    needs: files-changed
    runs-on: ["bitrise_pool_name:tahoe"]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"

      - name: Run harness tests
        run: |
          set -o pipefail
          env -u KSCRASH_PATH swift test \
            --package-path Tests/ThreadInspectionHarness \
            2>&1 | tee thread-inspection-harness.log

      - name: Run harness with ASan
        run: |
          set -o pipefail
          env -u KSCRASH_PATH swift test \
            --package-path Tests/ThreadInspectionHarness \
            --scratch-path "$RUNNER_TEMP/thread-inspection-asan" \
            --sanitize address \
            2>&1 | tee thread-inspection-harness-asan.log

      - name: Run harness with UBSan
        run: |
          set -o pipefail
          env -u KSCRASH_PATH swift test \
            --package-path Tests/ThreadInspectionHarness \
            --scratch-path "$RUNNER_TEMP/thread-inspection-ubsan" \
            --sanitize undefined \
            2>&1 | tee thread-inspection-harness-ubsan.log

      # TSan does not model Mach suspension as synchronization. Keep real remote suspension out of
      # this run while covering the registry, deterministic driver, and lifecycle concurrency.
      - name: Run harness with TSan
        run: |
          set -o pipefail
          env -u KSCRASH_PATH swift test \
            --package-path Tests/ThreadInspectionHarness \
            --scratch-path "$RUNNER_TEMP/thread-inspection-tsan" \
            --sanitize thread \
            --filter 'ReservedThreadContractTests|SentryThreadSnapshotTests|SentryThreadInspectionLifecycleTests' \
            2>&1 | tee thread-inspection-harness-tsan.log

      - name: Archive harness logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: thread-inspection-harness-logs
          path: thread-inspection-harness*.log

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  # This check validates that either all unit tests passed or were skipped, which allows us
  # to make unit tests a required check with only running the unit tests when required.
  # So, we don't have to run unit tests, for example, for Changelog or ReadMe changes.

  unit-tests-required-check:
    needs:
      [
        files-changed,
        build-test-server,
        distribution-tests,
        unit-tests,
        thread-inspection-harness,
        run-full-ci-gate,
        unit-tests-with-test-server,
      ]
    name: Unit Tests
    # This is necessary since a failed/skipped dependent job would cause this job to be skipped
    if: always()
    runs-on: ubuntu-latest
    steps:
      # If any jobs we depend on fails gets cancelled or times out, this job will fail.
      # Skipped jobs are not considered failures.
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the unit test jobs has failed." && exit 1
