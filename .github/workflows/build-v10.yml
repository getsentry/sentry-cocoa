name: Build V10
on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-full-ci-gate:
    name: run-full-ci gate
    uses: ./.github/workflows/run-full-ci-workflow.yml

  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    needs: run-full-ci-gate
    outputs:
      run_v10_for_prs: ${{ steps.changes.outputs.run_v10_for_prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  verify-v10-source-contract:
    name: Verify Source Contract
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify source contract
        run: ./scripts/verify-v10-sentrycrash-source-contract.swift

  build-v10:
    name: Build V10 ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            make-target: build-ios-v10
            objects-configuration: DebugV10-iphonesimulator
          - platform: macOS
            make-target: build-macos-v10
            objects-configuration: DebugV10
          - platform: Catalyst
            make-target: build-catalyst-v10
            objects-configuration: DebugV10-maccatalyst
          - platform: tvOS
            make-target: build-tvos-v10
            objects-configuration: DebugV10-appletvsimulator
          - platform: visionOS
            make-target: build-visionos-v10
            objects-configuration: DebugV10-xrsimulator
          - platform: watchOS
            make-target: build-watchos-v10
            objects-configuration: DebugV10-watchsimulator

    steps:
      - name: Warm CoreSimulator
        run: xcrun simctl list runtimes -j > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"

      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: ${{ matrix.platform }}

      - name: Build V10
        env:
          IOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.ios-simulator-os }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          TVOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.tvos-simulator-os }}
          TVOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          VISIONOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.visionos-simulator-os }}
          VISIONOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          WATCHOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.watchos-simulator-os }}
          WATCHOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
        run: |
          # This build-only lane audits implementation-free objects. Coverage inserts
          # executable LLVM runtime helpers even into empty Swift files. Unit-test
          # lanes retain their existing coverage settings.
          printf 'ENABLE_CODE_COVERAGE = NO\n' > "$RUNNER_TEMP/v10-audit.xcconfig"
          XCODE_XCCONFIG_FILE="$RUNNER_TEMP/v10-audit.xcconfig" make ${{ matrix.make-target }}

      - name: Verify recorder source exclusion
        run: |
          objects_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Sentry.build/${{ matrix.objects-configuration }}/SentryV10.build/Objects-normal' -print -quit)"
          if [[ -z "$objects_path" ]]; then
            echo "::error::Could not find SentryV10 object output"
            exit 1
          fi
          # The log includes package-target outputs as well as SentryV10 objects.
          ./scripts/verify-v10-sentrycrash-objects.sh --build-path "${objects_path%%/Build/*}" \
            --build-log raw-build-output.log

      - name: Verify SentryCrash framework contract
        run: |
          framework_path="$(find "$HOME/Library/Developer/Xcode/DerivedData" -type d -path '*/Build/Products/${{ matrix.objects-configuration }}/Sentry.framework' -print -quit)"
          if [[ -z "$framework_path" ]]; then
            echo "::error::Could not find the SentryV10 framework output"
            exit 1
          fi
          ./scripts/verify-v10-sentrycrash-framework.sh --framework-path "$framework_path"

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  verify-no-binary-targets:
    name: Verify no binary targets with SDK_V10
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Verify no binary targets in package manifest
        env:
          SDK_V10: "1"
        run: |
          echo "Dumping package manifest with SDK_V10=1..."
          swift package dump-package 2>/dev/null | jq . > package-dump.json

          binary_count=$(jq '[.targets[] | select(.type == "binary")] | length' package-dump.json)
          if [ "$binary_count" -ne 0 ]; then
            echo "::error::Found $binary_count binary target(s) when SDK_V10=1. Binary targets must be gated behind the V10 flag."
            jq '[.targets[] | select(.type == "binary") | .name]' package-dump.json
            exit 1
          fi
          echo "No binary targets found — OK"

  build-v10-spm:
    name: SPM V10 ${{ matrix.mode }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mode: [environment, trait, base-manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Test build output checks
        run: |
          ./scripts/test-v10-compiler-log.sh
          ./scripts/test-v10-empty-objects.sh --work-dir "$RUNNER_TEMP/v10-empty-audit"
          ./scripts/test-v10-sentryobjc-slice-inventory.sh --work-dir "$RUNNER_TEMP/v10-slice-audit"
      - name: Build Swift with environment
        if: matrix.mode == 'environment'
        env:
          SDK_V10: "1"
        run: swift build -v --target SentrySwift --scratch-path .build/v10-environment 2>&1 | tee v10-environment.log
      - name: Build source SDK with environment
        if: matrix.mode == 'environment'
        env:
          SDK_V10: "1"
        run: |
          swift build -v --target SentryObjCInternal --scratch-path .build/v10-environment 2>&1 | tee -a v10-environment.log
          swift build -v --target SentryTestUtils --scratch-path .build/v10-environment 2>&1 | tee -a v10-environment.log
          ./scripts/verify-v10-sentrycrash-objects.sh --build-path .build/v10-environment \
            --build-log v10-environment.log
      - name: Build Swift with trait
        if: matrix.mode == 'trait'
        run: swift build -v --target SentrySwift --traits V10 --scratch-path .build/v10-trait 2>&1 | tee v10-trait.log
      - name: Verify SentryCrash sources with trait
        if: matrix.mode == 'trait'
        run: |
          swift build -v --target SentryObjCInternal --traits V10 --scratch-path .build/v10-trait 2>&1 | tee -a v10-trait.log
          swift build -v --target SentryTestUtils --traits V10 --scratch-path .build/v10-trait 2>&1 | tee -a v10-trait.log
          ./scripts/verify-v10-sentrycrash-objects.sh --build-path .build/v10-trait \
            --build-log v10-trait.log
      - name: Build Swift with base manifest
        if: matrix.mode == 'base-manifest'
        env:
          SDK_V10: "1"
        run: |
          rm Package@swift-6.1.swift Package@swift-6.2.swift
          swift build -v --target SentrySwift --scratch-path .build/v10-base-manifest 2>&1 | tee v10-base-manifest.log
      - name: Build source SDK with base manifest
        if: matrix.mode == 'base-manifest'
        env:
          SDK_V10: "1"
        run: |
          swift build -v --target SentryObjCInternal --scratch-path .build/v10-base-manifest 2>&1 | tee -a v10-base-manifest.log
          swift build -v --target SentryTestUtils --scratch-path .build/v10-base-manifest 2>&1 | tee -a v10-base-manifest.log
          ./scripts/verify-v10-sentrycrash-objects.sh --build-path .build/v10-base-manifest \
            --build-log v10-base-manifest.log
      - name: Upload build check logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v10-spm-audit-${{ matrix.mode }}
          path: |
            v10-*.log
            ${{ runner.temp }}/v10-empty-audit
            ${{ runner.temp }}/v10-slice-audit

  package-v10:
    name: Package V10 ${{ matrix.sdk }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sdk:
          [
            iphoneos,
            iphonesimulator,
            macosx,
            maccatalyst,
            appletvos,
            appletvsimulator,
            watchos,
            watchsimulator,
            xros,
            xrsimulator,
          ]
    steps:
      - name: Warm CoreSimulator
        run: xcrun simctl list runtimes -j > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Test archive audit path
        run: ./scripts/test-v10-archive-audit-path.sh
      - name: Test wrapper archive architectures
        if: matrix.sdk == 'watchos'
        run: ./scripts/test-sentryobjc-archive-architectures.sh --work-dir "$RUNNER_TEMP/wrapper-archive-architectures"
      - name: Build and audit dynamic V10 XCFramework
        run: make build-xcframework-v10-dynamic SDKS=${{ matrix.sdk }}
      - name: Build and audit static V10 XCFramework
        run: make build-xcframework-v10-static SDKS=${{ matrix.sdk }}
      - name: Check packaged SDK build output
        run: |
          objects_path="XCFrameworkBuildPath/DerivedData/Build/Intermediates.noindex"
          archive_objects="$objects_path/ArchiveIntermediates/SentryV10/IntermediateBuildFilesPath"
          if [[ -d "$archive_objects" ]]; then objects_path="$archive_objects"; fi
          ./scripts/verify-v10-sentrycrash-objects.sh --build-path "$objects_path" \
            --build-log "XCFrameworkBuildPath/raw-build-output.log"
      - name: Build and audit V10 SentryObjC XCFrameworks
        run: make build-xcframework-sentryobjc-v10 SDKS=${{ matrix.sdk }}
      - name: Upload archive regression logs
        if: failure() && matrix.sdk == 'watchos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wrapper-archive-architectures
          path: |
            ${{ runner.temp }}/wrapper-archive-architectures/**/*.log
            ${{ runner.temp }}/wrapper-archive-architectures/**/*.exit-status
      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  build-v10-testapps:
    name: Test App V10 ${{ matrix.scheme }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: watchOS-Swift WatchKit App
            make-target: build-testapp-v10-watchOS-Swift
            platform: watchOS
          - scheme: macOS-SwiftUI
            make-target: build-testapp-v10-macOS-SwiftUI
            platform: macOS
          - scheme: iOS-Swift
            make-target: build-testapp-v10-iOS-Swift
            platform: iOS
          - scheme: macOS-Swift
            make-target: build-testapp-v10-macOS-Swift
            platform: macOS
          - scheme: tvOS-Swift
            make-target: build-testapp-v10-tvOS-Swift
            platform: tvOS
          - scheme: visionOS-Swift
            make-target: build-testapp-v10-visionOS-Swift
            platform: visionOS
          - scheme: iOS-SwiftUI
            make-target: build-testapp-v10-iOS-SwiftUI
            platform: iOS
          - scheme: iOS-ObjectiveC
            make-target: build-testapp-v10-iOS-ObjectiveC
            platform: iOS
          - scheme: iOS-ObjectiveCpp-NoModules
            make-target: build-testapp-v10-iOS-ObjectiveCpp-NoModules
            platform: iOS
          - scheme: SPM
            make-target: build-testapp-v10-SPM
            platform: macOS
          - scheme: DistributionSample
            make-target: build-testapp-v10-DistributionSample
            platform: macOS
    steps:
      - name: Warm CoreSimulator
        run: xcrun simctl list runtimes -j > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove binary targets from Package.swift
        run: ./scripts/prepare-package.sh --remove-binary-targets true
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: ${{ matrix.platform }}
      - run: make init-ci-build
      - run: make ${{ matrix.make-target }}
        env:
          IOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.ios-simulator-os }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          TVOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.tvos-simulator-os }}
          TVOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          VISIONOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.visionos-simulator-os }}
          VISIONOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          WATCHOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.watchos-simulator-os }}
          WATCHOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}

      - name: Archiving Raw Build Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-build-output-v10-${{matrix.scheme}}
          path: |
            raw-build-output.log

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  check-v10-macOS-CLI-Xcode-no-UI-framework:
    name: Verify CLI UI Linkage
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_v10_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Remove binary targets from Package.swift
        run: ./scripts/prepare-package.sh --remove-binary-targets true
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"

      - run: make init-ci-build
      - name: Test crash backend selection
        run: ./scripts/test-spm-crash-backend-selection.swift --work-dir "$RUNNER_TEMP/crash-backend-selection"
      - name: Test V9 NoUI linkage
        run: ./scripts/test-spm-v9-no-ui-framework.swift --work-dir "$RUNNER_TEMP/v9-no-ui-framework"
      - name: Upload backend selection logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: crash-backend-selection-logs
          path: |
            ${{ runner.temp }}/crash-backend-selection/*.log
            ${{ runner.temp }}/crash-backend-selection/*.exit-status
            ${{ runner.temp }}/v9-no-ui-framework/*.log
            ${{ runner.temp }}/v9-no-ui-framework/*.exit-status
      - run: scripts/generate-testapp-v10.sh --spec TestApps/macOS-CLI-Xcode/macOS-CLI-Xcode.yml

      - name: Build macOS-CLI-Xcode test app
        run: |
          set -o pipefail && xcodebuild \
            -project "TestApps/macOS-CLI-Xcode/macOS-CLI-Xcode.xcodeproj" \
            -scheme macOS-CLI-Xcode \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/cli-xcode-build" \
            CODE_SIGNING_ALLOWED="NO" build | xcbeautify --preserve-unbeautified

      - name: Ensure CLI binary does not link AppKit
        run: ./scripts/check-ui-framework-linkage.sh --configuration Debug --derived-data "$GITHUB_WORKSPACE/cli-xcode-build" --linkage unlinked --module macOS-CLI-Xcode --framework AppKit

      - name: Ensure CLI binary does not link UIKit
        run: ./scripts/check-ui-framework-linkage.sh --configuration Debug --derived-data "$GITHUB_WORKSPACE/cli-xcode-build" --linkage unlinked --module macOS-CLI-Xcode --framework UIKit

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  build-v10-required-check:
    needs:
      [
        files-changed,
        build-v10,
        build-v10-spm,
        build-v10-testapps,
        package-v10,
        check-v10-macOS-CLI-Xcode-no-UI-framework,
        verify-no-binary-targets,
        verify-v10-source-contract,
        run-full-ci-gate,
      ]
    name: Build V10
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the V10 build jobs has failed." && exit 1
