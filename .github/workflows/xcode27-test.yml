name: Xcode 27

on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, labeled]

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-full-ci-gate:
    name: run-full-ci gate
    uses: ./.github/workflows/run-full-ci-workflow.yml

  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    needs: run-full-ci-gate
    outputs:
      run_xcode27_for_prs: ${{ steps.changes.outputs.run_xcode27_for_prs }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build-spm:
    name: Build SPM ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_xcode27_for_prs == 'true'
    needs: files-changed
    runs-on:
      - bitrise_pool_name:xcode-beta
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            sdk: iphoneos
            destination: "generic/platform=iphoneos"
          - platform: watchOS
            sdk: watchos
            destination: "generic/platform=watchOS"
          - platform: macOS
            sdk: macosx
            destination: "generic/platform=macOS"
          - platform: tvOS
            sdk: appletvos
            destination: "generic/platform=tvOS"
          - platform: visionOS
            sdk: xros
            destination: "generic/platform=visionOS"
    steps:
      - name: Warm CoreSimulator
        run: xcrun simctl list runtimes -j > /dev/null 2>&1 &
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "27"
          allow-prerelease: "true"
          resolve-simulators: "false"
      - name: Build SPM (${{ matrix.platform }})
        run: |
          ./scripts/sentry-xcodebuild.sh \
            --workspace . \
            --scheme SentrySPM \
            --sdk ${{ matrix.sdk }} \
            --destination '${{ matrix.destination }}' \
            --command build
      - name: Upload Build Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-build-output-${{ matrix.sdk }}
          path: raw-build-output.log
      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  # Validates that all Xcode 27 SPM builds passed or were skipped, so this
  # workflow can be a required check without running on unrelated PR changes.
  build-spm-required-check:
    needs:
      [
        run-full-ci-gate,
        files-changed,
        build-spm,
      ]
    name: Xcode 27
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the Xcode 27 SPM build jobs has failed." && exit 1
