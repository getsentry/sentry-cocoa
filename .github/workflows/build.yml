name: Build
on:
  push:
    branches:
      - main

  pull_request:
    types: [
      opened,
      synchronize,
      reopened,
      labeled,
      unlabeled,
      ready_for_review,
      converted_to_draft,
    ]

# Concurrency configuration:
# - We use workflow-specific concurrency groups to prevent multiple build runs of the same code,
#   which would waste CI resources without providing additional value.
# - For pull requests, we cancel in-progress builds when new commits are pushed since only the
#   latest commit's build results matter for merge decisions.
# - For main branch pushes, we never cancel builds to ensure all release and test app builds complete,
#   as broken builds on main could block releases and affect downstream consumers.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-full-ci-gate:
    name: CI eligibility
    uses: ./.github/workflows/run-full-ci-workflow.yml

  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    needs: run-full-ci-gate
    if: needs.run-full-ci-gate.outputs.run_ci == 'true'
    outputs:
      run_build_for_prs: ${{ steps.changes.outputs.run_build_for_prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build-sdk:
    name: Build ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: iOS
            make-target: build-ios
          - platform: macOS
            make-target: build-macos
          - platform: Catalyst
            make-target: build-catalyst
          - platform: tvOS
            make-target: build-tvos
          - platform: visionOS
            make-target: build-visionos
          - platform: watchOS
            make-target: build-watchos

    steps:
      # === Checkout and independent preparation ===
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}

      # === Toolchain and simulator preparation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"

      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: ${{ matrix.platform }}

      - name: Build
        env:
          IOS_SIMULATOR_OS: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          TVOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.tvos-simulator-os }}
          TVOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          VISIONOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.visionos-simulator-os }}
          VISIONOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          WATCHOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.watchos-simulator-os }}
          WATCHOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
        run: make ${{ matrix.make-target }}

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  verify-no-binary-targets:
    name: Verify no binary targets with SDK_V10
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Verify no binary targets in package manifest
        env:
          SDK_V10: "1"
        run: |
          echo "Dumping package manifest with SDK_V10=1..."
          swift package dump-package 2>/dev/null | jq . > package-dump.json

          binary_count=$(jq '[.targets[] | select(.type == "binary")] | length' package-dump.json)
          if [ "$binary_count" -ne 0 ]; then
            echo "::error::Found $binary_count binary target(s) when SDK_V10=1. Binary targets must be gated behind the V10 flag."
            jq '[.targets[] | select(.type == "binary") | .name]' package-dump.json
            exit 1
          fi
          echo "No binary targets found — OK"

  build-spm:
    name: Build SPM ${{ matrix.mode }}
    env:
      SDK_V10: "1"
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        mode: [environment, base-manifest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Build Swift with environment
        if: matrix.mode == 'environment'
        run: swift build -v --target Sentry --scratch-path .build/v10-environment 2>&1 | tee v10-environment.log
      - name: Build source SDK with environment
        if: matrix.mode == 'environment'
        run: |
          swift build -v --target SentryObjCInternal --scratch-path .build/v10-environment 2>&1 | tee -a v10-environment.log
          swift build -v --target SentryTestUtils --scratch-path .build/v10-environment 2>&1 | tee -a v10-environment.log
      - name: Build Swift with base manifest
        if: matrix.mode == 'base-manifest'
        run: |
          rm Package@swift-6.1.swift Package@swift-6.2.swift
          swift build -v --target Sentry --scratch-path .build/v10-base-manifest 2>&1 | tee v10-base-manifest.log
      - name: Build source SDK with base manifest
        if: matrix.mode == 'base-manifest'
        run: |
          swift build -v --target SentryObjCInternal --scratch-path .build/v10-base-manifest 2>&1 | tee -a v10-base-manifest.log
          swift build -v --target SentryTestUtils --scratch-path .build/v10-base-manifest 2>&1 | tee -a v10-base-manifest.log
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: spm-build-${{ matrix.mode }}
          path: v10-*.log

  package-sdk:
    name: Package ${{ matrix.sdk }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        sdk:
          [
            iphoneos,
            iphonesimulator,
            macosx,
            maccatalyst,
            appletvos,
            appletvsimulator,
            watchos,
            watchsimulator,
            xros,
            xrsimulator,
          ]
    steps:
      # === Checkout and independent preparation ===
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}

      # === Toolchain and simulator preparation ===
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null
      - name: Test static library architectures
        if: matrix.sdk == 'watchos'
        run: ./scripts/test-static-library-archive-architectures.sh --work-dir "$RUNNER_TEMP/static-library-archive-architectures"

      # === Build and validation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator
      - name: Build and validate dynamic V10 XCFramework
        run: make build-xcframework-dynamic SDKS=${{ matrix.sdk }}
      - name: Build and validate static V10 XCFramework
        run: make build-xcframework-static SDKS=${{ matrix.sdk }}
      - name: Build and validate V10 SentryObjC XCFrameworks
        run: make build-xcframework-sentryobjc SDKS=${{ matrix.sdk }}

      # === Artifacts and diagnostics ===
      - name: Upload archive regression logs
        if: failure() && matrix.sdk == 'watchos'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: static-library-archive-architectures
          path: |
            ${{ runner.temp }}/static-library-archive-architectures/**/*.log
            ${{ runner.temp }}/static-library-archive-architectures/**/*.exit-status
      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  # We had issues that the release build was broken on main.
  # With this we catch potential issues already in the PR.
  ios-swift-release:
    env:
      SDK_V10: "1"
    name: Release Build of iOS Swift
    # Run the job for PRs with related changes (including external contributors) or non-PR events.
    # Don't run this on release branches, cause the SPM Package.swift points to the unreleased versions.
    if: startsWith(github.ref, 'refs/heads/release/') == false && (github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true')
    needs: files-changed
    runs-on: macos-26
    steps:
      # === Checkout and independent preparation ===
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      # As the DistributionSample project uses local SPM, xcodebuild resolves SPM dependencies for all
      # test app projects. The Package.swift references binary targets, which in release branch commits points
      # to non-existent download URLs. This creates chicken-egg failures when building these test apps for
      # a release commit build. When building these test apps for a release commit, xcodebuild tries to
      # resolve all SPM dependencies, including the binary targets pointing to these non-existent URLs.  The
      # test app projects don't use SPM for including Sentry. Only the DistributionSample uses local SPM.
      # Therefore, we only keep the local DistributionSample reference in the Package.swift as a workaround.
      - name: Only keep distribution lib and target in Package.swift
        run: ./scripts/prepare-package.sh --remove-binary-targets true

      # === Toolchain and simulator preparation ===
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null
      - name: Setup Ruby
        uses: ruby/setup-ruby@be3c7df29b3349ec6bcfc6b4792f1cf9f5237d18 # v1.343.0
        with:
          bundler-cache: true
      - run: make init-ci-build
      - run: make xcode-ci

      # === Build and validation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator
      - name: Run Fastlane
        # We only need to archive, not package the IPA, so we skip codesigning.
        run: bundle exec fastlane build_ios_swift_without_codesigning

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  build-testapp-spm:
    name: Test App SPM ${{ matrix.name }}
    # Don't run this on release branches, cause the SPM Package.swift points to the unreleased versions.
    if: startsWith(github.ref, 'refs/heads/release/') == false && (github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true')
    needs: files-changed
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: iOS
            make-target: build-testapp-iOS-SwiftUI-SPM
          - name: iOS C++ interop
            make-target: build-testapp-iOS-SwiftUI-SPM
            configuration: Debug-CxxInterop
          - name: watchOS
            make-target: build-testapp-watchOS-SwiftUI-SPM
          - name: tvOS
            make-target: build-testapp-tvOS-SwiftUI-SPM
          - name: macOS
            make-target: build-testapp-macOS-SwiftUI-SPM
          - name: visionOS
            make-target: build-testapp-visionOS-SwiftUI-SPM
    steps:
      # === Checkout and independent preparation ===
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}

      # === Toolchain and simulator preparation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"

      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: iOS

      - run: make init-ci-build

      - name: Build Test App
        run: make ${{ matrix.make-target }}
        env:
          IOS_SPM_BUILD_CONFIGURATION: ${{ matrix.configuration || 'Debug' }}
          IOS_SIMULATOR_OS: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  build-testapp:
    name: Test App ${{ matrix.scheme }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # other test app projects are built in ui-tests
        include:
          - scheme: watchOS-Swift WatchKit App
            make-target: build-testapp-watchOS-Swift
            platform: watchOS
          - scheme: macOS-SwiftUI
            make-target: build-testapp-macOS-SwiftUI
            platform: macOS
          - scheme: iOS-Swift
            make-target: build-testapp-iOS-Swift
            platform: iOS
          - scheme: macOS-Swift
            make-target: build-testapp-macOS-Swift
            platform: macOS
          - scheme: tvOS-Swift
            make-target: build-testapp-tvOS-Swift
            platform: tvOS
          - scheme: visionOS-Swift
            make-target: build-testapp-visionOS-Swift
            platform: visionOS
          - scheme: iOS-SwiftUI
            make-target: build-testapp-iOS-SwiftUI
            platform: iOS
          - scheme: iOS-ObjectiveC
            make-target: build-testapp-iOS-ObjectiveC
            platform: iOS
          - scheme: iOS-ObjectiveCpp-NoModules
            make-target: build-testapp-iOS-ObjectiveCpp-NoModules
            platform: iOS
          - scheme: SPM
            make-target: build-testapp-SPM
            platform: macOS
          - scheme: DistributionSample
            make-target: build-testapp-DistributionSample
            platform: macOS
    steps:
      # === Checkout and independent preparation ===
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
      # Some test app projects use local SPM references. xcodebuild resolves SPM dependencies for the
      # workspace, so Package.swift binary targets can be resolved even when building another scheme.
      # On release branches these binary target URLs point to artifacts that do not exist yet, causing
      # release commit builds to fail before the artifacts are published.
      - name: Remove binary targets from Package.swift
        run: ./scripts/prepare-package.sh --remove-binary-targets true

      # === Toolchain and simulator preparation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
      - name: Resolve test destination
        id: resolve-test-destination
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: ${{ matrix.platform }}
      - run: make init-ci-build
      # Note: Due to complexity in implementing the CODE_SIGNING_ALLOWED flag in the sentry-xcodebuild.sh script,
      #       we did not yet migrate this step to use the script yet.
      - run: make ${{ matrix.make-target }}
        env:
          IOS_SIMULATOR_OS: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          TVOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.tvos-simulator-os }}
          TVOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          VISIONOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.visionos-simulator-os }}
          VISIONOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
          WATCHOS_SIMULATOR_OS: ${{ steps.setup-xcode.outputs.watchos-simulator-os }}
          WATCHOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}

      # === Artifacts and diagnostics ===
      - name: Archiving Raw Build Logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-build-output-${{matrix.scheme}}
          path: |
            raw-build-output.log

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  check-macOS-CLI-Xcode-no-UI-framework:
    env:
      SDK_V10: "1"
    name: macOS CLI (NoUIFramework) builds and has no AppKit/UIKit
    # Don't run this on release branches, cause the SPM Package.swift points to the unreleased versions.
    if: startsWith(github.ref, 'refs/heads/release/') == false && (github.event_name != 'pull_request' || needs.files-changed.outputs.run_build_for_prs == 'true')
    needs: files-changed
    runs-on: macos-26
    steps:
      # === Checkout and independent preparation ===
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}

      # === Toolchain and simulator preparation ===
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null

      - run: make init-ci-build
      - run: make xcode-ci-macOS-CLI-Xcode

      # === Build and validation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator

      - name: Test CLI subprocesses
        run: |
          set -o pipefail && xcodebuild \
            -project "TestApps/macOS-CLI-Xcode/macOS-CLI-Xcode.xcodeproj" \
            -scheme macOS-CLI-Xcode \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$GITHUB_WORKSPACE/cli-xcode-build" \
            CODE_SIGNING_ALLOWED="NO" test | xcbeautify --preserve-unbeautified

      - name: Ensure CLI binary does not link AppKit
        run: ./scripts/check-ui-framework-linkage.sh --configuration Debug --derived-data "$GITHUB_WORKSPACE/cli-xcode-build" --linkage unlinked --module macOS-CLI-Xcode --framework AppKit

      - name: Ensure CLI binary does not link UIKit
        run: ./scripts/check-ui-framework-linkage.sh --configuration Debug --derived-data "$GITHUB_WORKSPACE/cli-xcode-build" --linkage unlinked --module macOS-CLI-Xcode --framework UIKit

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  build-required-check:
    needs:
      [
        files-changed,
        build-sdk,
        build-spm,
        build-testapp,
        ios-swift-release,
        build-testapp-spm,
        package-sdk,
        check-macOS-CLI-Xcode-no-UI-framework,
        verify-no-binary-targets,
        run-full-ci-gate,
      ]
    name: Build
    # This is necessary since a failed/skipped dependent job would cause this job to be skipped
    if: always()
    runs-on: ubuntu-latest
    steps:
      # If any jobs we depend on fails gets cancelled or times out, this job will fail.
      # Skipped jobs are not considered failures.
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the build jobs has failed." && exit 1
