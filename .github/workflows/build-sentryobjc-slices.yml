name: Build SentryObjC Slice

on:
  workflow_call:
    inputs:
      sdk-list:
        description: |-
          JSON array of Apple platform SDK names to build slices for.
          E.g. '["iphoneos", "iphonesimulator", "macosx"]'
        required: false
        default: '["iphoneos", "iphonesimulator", "macosx", "maccatalyst", "appletvos", "appletvsimulator", "watchos", "watchsimulator", "xros", "xrsimulator"]'
        type: string

      release-version:
        description: |-
          For release workflows, the version to inject into the SDK.
        required: false
        type: string

jobs:
  build-sentryobjc-static-slice:
    name: ${{ matrix.sdk }}
    runs-on: macos-26

    strategy:
      matrix:
        sdk: ${{ fromJson(inputs.sdk-list) }}

    steps:
      # === Checkout and independent preparation ===
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access

      # === Toolchain and simulator preparation ===
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null

      - name: Get version
        id: get-version
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep MARKETING_VERSION Sources/Configuration/Versioning.xcconfig | cut -d ' ' -f 3)+$GITHUB_SHA" >> "$GITHUB_ENV"
          fi

      - name: Bump version
        env:
          VERSION: ${{ env.VERSION }}
        run: ./scripts/bump-version.sh --version "$VERSION"

      - name: Strip binary targets from Package.swift
        run: ./scripts/prepare-package.sh --strip-binary-targets true

      # === Build and validation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator

      - name: Build SentryObjC static library for ${{ matrix.sdk }}
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          ./scripts/build-static-library-sentryobjc.sh \
            --sdk "$SDK" \
            --output-dir XCFrameworkBuildPath

      # === Publish slices while building and packaging ===
      - name: Upload static slice
        id: upload-static-slice
        background: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sentryobjc-slice-${{ matrix.sdk }}
          if-no-files-found: error
          path: XCFrameworkBuildPath/lib/SentryObjC/${{ matrix.sdk }}/libSentryObjC.a

      # Build the dynamic framework on the same runner so dsymutil can
      # access the .o files from the archive step above. Running this in a
      # separate job (the previous approach) meant the object files were gone
      # and dsymutil produced an empty dSYM.
      - name: Build SentryObjC dynamic framework for ${{ matrix.sdk }}
        env:
          SDK: ${{ matrix.sdk }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          version_args=()
          if [ -n "$RELEASE_VERSION" ]; then
            version_args=(--version "$RELEASE_VERSION")
          fi
          ./scripts/build-dynamic-framework-sentryobjc.sh \
            --sdk "$SDK" \
            --static-lib "XCFrameworkBuildPath/lib/SentryObjC/$SDK/libSentryObjC-Debug.a" \
            --headers "Sources/SentryObjC/Public" \
            --output-dir XCFrameworkBuildPath \
            "${version_args[@]}"

      # Tar preserves macOS framework symlinks that actions/upload-artifact
      # would otherwise flatten.
      - name: Package dynamic framework slice
        env:
          SDK: ${{ matrix.sdk }}
        run: |
          tar -czf "XCFrameworkBuildPath/sentryobjc-dynamic-$SDK.tar.gz" \
            -C "XCFrameworkBuildPath/framework/SentryObjC/$SDK" \
            SentryObjC.framework SentryObjC.framework.dSYM

      - name: Upload dynamic framework slice
        id: upload-dynamic-slice
        background: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sentryobjc-dynamic-slice-${{ matrix.sdk }}
          if-no-files-found: error
          path: XCFrameworkBuildPath/sentryobjc-dynamic-${{ matrix.sdk }}.tar.gz

      - name: Wait for slice uploads
        wait: [upload-static-slice, upload-dynamic-slice]

      - name: Upload build log if failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-build-output-sentryobjc-${{ matrix.sdk }}
          path: |
            XCFrameworkBuildPath/archive/SentryObjC/${{ matrix.sdk }}.log

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()
