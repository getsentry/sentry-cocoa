name: Benchmarking
on:
  push:
    branches:
      - main
      # TEMPORARY — delete before merging GH-8548. Lets the GH-1355 iOS 15 suite run from the
      # probe branch, reusing this workflow's working code signing and SauceLabs setup
      # instead of duplicating it. See Samples/iOS-Swift/Benchmarking/Sources/GH1355OldOrderingTests.m.
      - test/gh1355-ios15-saucelabs-probe
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-benchmark-test-target:
    name: Build App and Test Runner
    runs-on: macos-26
    steps:
      - name: Warm CoreSimulator
        run: xcrun simctl list runtimes -j > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: "false"
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          bundler-cache: true
      - run: make init-ci-build
      - run: make xcode-ci
      - name: Install Sentry CLI
        run: brew install getsentry/tools/sentry-cli
      - name: Build iOS-Swift for tests
        run: bundle exec fastlane build_ios_swift_for_tests
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
      - name: Build iOS benchmark test
        run: bundle exec fastlane build_ios_benchmark_test
        env:
          FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
          MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}

      - name: Upload dSYMs
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          sentry-cli upload-dif \
            --org sentry-sdks \
            --project sentry-cocoa \
            DerivedData/Build/Products/Debug-iphoneos/iOS-Swift.app.dSYM

      - name: Upload Built Apps for SauceLabs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-apps
          path: |
            **/Debug-iphoneos/iOS-Swift.app
            **/Debug-iphoneos/iOS-Benchmarking-Runner.app

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()

  run-ui-tests-with-sauce:
    name: Run Benchmarks ${{matrix.suite}}
    runs-on: ubuntu-latest
    needs: build-benchmark-test-target
    strategy:
      fail-fast: false
      matrix:
        # "GH-1355 iOS 15" is TEMPORARY — delete before merging GH-8548.
        suite: ["High-end device", "Low-end device", "GH-1355 iOS 15"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: benchmark-apps
      - run: npm install -g saucectl@0.197.2
      - name: Run Benchmarks in SauceLab
        id: run-benchmarks-in-sauce-lab
        uses: ./.github/actions/saucelabs-run
        with:
          select-suite: ${{ matrix.suite }}
          config: .sauce/benchmarking-config.yml
          tags: benchmark
          sauce-username: ${{ secrets.SAUCE_USERNAME }}
          sauce-access-key: ${{ secrets.SAUCE_ACCESS_KEY }}

      - name: Should Retry Test
        id: should-retry-test
        if: ${{ always() && steps.run-benchmarks-in-sauce-lab.outcome == 'failure' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
          SAUCE_ACCESS_KEY: ${{ secrets.SAUCE_ACCESS_KEY }}
          TEST_ID: ${{ steps.run-benchmarks-in-sauce-lab.outputs.test_id }}
        with:
          script: |
            const { execSync } = require('child_process');
            const testId = process.env.TEST_ID;

            if (!testId) {
              core.warning(
                'No SauceLabs test ID found in CLI output, it might have changed, retrying...'
              );
              core.setOutput('RETRY_TEST', 'true');
              return;
            }

            try {
              console.log(`Checking if the test exists in SauceLabs: ${testId}`);
              execSync(`saucectl jobs get ${testId}`, {
                env: process.env,
                stdio: 'inherit',
              });

              console.log('Test exists but failed, not retrying.');
              core.setFailed('Test exists but failed');
            } catch (error) {
              console.log('Failed to get job, retrying...');
              core.setOutput('RETRY_TEST', 'true');
            }

      - name: Run Benchmarks in SauceLab - Retry 1
        id: run-benchmarks-in-sauce-lab-retry-1
        if: ${{ always() && steps.should-retry-test.outputs.RETRY_TEST == 'true' }}
        uses: ./.github/actions/saucelabs-run
        with:
          select-suite: ${{ matrix.suite }}
          config: .sauce/benchmarking-config.yml
          tags: benchmark
          warning-message: SauceLabs benchmark tests need to be retried
          sauce-username: ${{ secrets.SAUCE_USERNAME }}
          sauce-access-key: ${{ secrets.SAUCE_ACCESS_KEY }}

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()
