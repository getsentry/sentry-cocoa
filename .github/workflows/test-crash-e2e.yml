name: Test Crash E2E
on:
  push:
    branches:
      - main

  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Concurrency configuration:
# - For pull requests, we cancel in-progress runs when new commits are pushed, since only the
#   latest commit matters and each run occupies four macOS runners.
# - For main branch pushes, we never cancel so every merged commit gets a complete crash
#   reporting signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  run-full-ci-gate:
    name: run-full-ci gate
    uses: ./.github/workflows/run-full-ci-workflow.yml

  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    needs: run-full-ci-gate
    outputs:
      run_crash_e2e_for_prs: ${{ steps.changes.outputs.run_crash_e2e_for_prs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Get changed files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  crash-e2e:
    name: Run ${{ matrix.reporter }} ${{ matrix.platform }}
    if: github.event_name != 'pull_request' || needs.files-changed.outputs.run_crash_e2e_for_prs == 'true'
    needs: files-changed
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # SentryCrash is the V9 reporter and KSCrash is the V10 reporter. Each job runs the
        # reporter-specific default scenarios from Config.swift in the CrashE2E runner.
        reporter: [SentryCrash, KSCrash]
        platform: [iOS, macOS]

    steps:
      - name: Warm CoreSimulator
        if: ${{ matrix.platform == 'iOS' }}
        run: xcrun simctl list runtimes -j > /dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Xcode
        id: setup-xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: "26"
          resolve-simulators: ${{ matrix.platform == 'iOS' }}

      - name: Resolve test destination
        id: resolve-test-destination
        if: ${{ matrix.platform == 'iOS' }}
        uses: ./.github/actions/resolve-test-destination
        with:
          platform: ${{ matrix.platform }}

      - name: Ensure required runtime is loaded
        if: ${{ matrix.platform == 'iOS' }}
        timeout-minutes: 5
        env:
          OS_VERSION: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          PLATFORM: ${{ matrix.platform }}
        run: ./scripts/ci-ensure-runtime-loaded.sh --os-version "$OS_VERSION" --platform "$PLATFORM"

      - run: make init-ci-build

      - name: Run Crash E2E scenarios
        env:
          REPORTER: ${{ matrix.reporter }}
          PLATFORM: ${{ matrix.platform }}
          IOS_SIMULATOR_OS: ${{ steps.resolve-test-destination.outputs.TEST_OS }}
          IOS_DEVICE_NAME: ${{ steps.resolve-test-destination.outputs.TEST_DEVICE }}
        run: |
          set -o pipefail
          ARGS=(--reporter "$REPORTER" --quiet-build --keep-going --keep-artifacts)
          if [[ "$PLATFORM" == "iOS" ]]; then
            ARGS+=(--platform ios --ios-destination "platform=iOS Simulator,name=${IOS_DEVICE_NAME},OS=${IOS_SIMULATOR_OS}")
          else
            ARGS+=(--platform macos)
          fi
          ./TestApps/CrashE2E/run-crash-e2e.sh "${ARGS[@]}" 2>&1 | tee raw-crash-e2e-output.log

      - name: Archiving Crash E2E Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: crash-e2e-${{ matrix.reporter }}-${{ matrix.platform }}
          path: |
            raw-crash-e2e-output.log
            TestApps/CrashE2E/artifacts/**

      - name: Archiving Crash Logs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: crash-logs-crash-e2e-${{ matrix.reporter }}-${{ matrix.platform }}
          path: |
            ~/Library/Logs/DiagnosticReports/**

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: ${{ failure() || cancelled() }}

  # This check validates that either all Crash E2E jobs passed or were skipped, which allows us
  # to make it a required check with only running the jobs when required.
  crash-e2e-required-check:
    needs: [files-changed, crash-e2e, run-full-ci-gate]
    name: Test Crash E2E
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "One of the Crash E2E jobs has failed." && exit 1
