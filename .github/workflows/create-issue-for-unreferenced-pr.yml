# This GitHub Action workflow checks if a new or updated pull request
# references a GitHub issue in its title or body. If no reference is found,
# it automatically creates a new issue. This helps ensure all work is
# tracked, especially when syncing with tools like Linear.

name: Create issue for unreferenced PR

# This action triggers on pull request events
on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

# Cancel in progress workflows on pull_requests.
# https://docs.github.com/en/actions/using-jobs/using-concurrency#example-using-a-fallback-value
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  issues: write
  pull-requests: write

jobs:
  check_for_issue_reference:
    runs-on: ubuntu-latest
    # Only run on PRs from contributors.
    if: contains(fromJson('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association)
    steps:
      - name: Check PR Body and Title for Issue Reference
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Could not get PR from context.');
              return;
            }

            // Don't create an issue for draft PRs
            if (pr.draft) {
              console.log(`PR #${pr.number} is a draft, skipping issue creation.`);
              return;
            }

            // Check if the PR is already approved
            const reviewsResponse = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            if (reviewsResponse.data.some(review => review.state === 'APPROVED')) {
              console.log(`PR #${pr.number} is already approved, skipping issue creation.`);
              return;
            }

            const prBody = pr.body || '';
            const prTitle = pr.title || '';
            const prAuthor = pr.user.login;
            const prUrl = pr.html_url;
            const prNumber = pr.number;

            // Regex for GitHub issue references (e.g., #123, fixes #456)
            // https://regex101.com/r/eDiGrQ/1
            const issueRegexGitHub = /(?:(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved):?\s*)?(#\d+|https:\/\/github\.com\/getsentry\/[\w-]+\/issues\/\d+)/i;

            // Regex for Linear issue references (e.g., ENG-123, resolves ENG-456)
            // Case-sensitive: Linear keys are always uppercase (COCOA-123, not iOS-16)
            const issueRegexLinear = /(?:(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*)?\b[A-Z]{2,}-\d+\b/;

            const contentToCheck = `${prTitle} ${prBody}`;
            const hasIssueReference = issueRegexGitHub.test(contentToCheck) || issueRegexLinear.test(contentToCheck);

            if (hasIssueReference) {
              console.log(`PR #${prNumber} contains a valid issue reference.`);
              return;
            }

            // Check if there's already an issue created by this automation for this PR
            // Uses the Issues list API (strongly consistent) instead of the Search API
            // (eventually consistent) to avoid race conditions when multiple runs overlap.
            const existingIssuesResponse = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: 'github-actions[bot]',
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            const existingIssue = existingIssuesResponse.data.find(issue =>
              !issue.pull_request && issue.body && issue.body.includes(prUrl)
            );

            if (existingIssue) {
              console.log(`An issue (#${existingIssue.number}) already exists for PR #${prNumber}, skipping creation.`);
              return;
            }

            core.warning(`PR #${prNumber} does not have an issue reference. Creating a new issue so it can be tracked in Linear.`);

            // Prefer human Co-Authored-By trailers (Junior credits requesters there).
            // Never assign bots/apps: GitHub App installation tokens cannot assign agents.
            const isBotLogin = (login) => {
              if (!login) return true;
              const normalized = String(login).toLowerCase();
              return normalized.endsWith('[bot]') || normalized === 'github-actions[bot]';
            };

            const loginFromNoreplyEmail = (email) => {
              const match = String(email || '').match(
                /^(?:[1-9]\d*\+)?([^@\s]+)@users\.noreply\.github\.com$/i
              );
              return match?.[1] || undefined;
            };

            const parseCoAuthorTrailers = (message) => {
              const trailers = [];
              const regex = /^co-authored-by:\s*(.+?)\s*<([^>\s]+)>$/gim;
              let match;
              while ((match = regex.exec(message || '')) !== null) {
                trailers.push({ name: match[1].trim(), email: match[2].trim() });
              }
              return trailers;
            };

            const resolveLoginForEmail = async (email) => {
              const fromNoreply = loginFromNoreplyEmail(email);
              if (fromNoreply) {
                return fromNoreply;
              }

              // Fall back to commits authored with this email in this repo.
              try {
                const commits = await github.rest.repos.listCommits({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  author: email,
                  per_page: 1,
                });
                const login = commits.data?.[0]?.author?.login;
                if (login) {
                  return login;
                }
              } catch (error) {
                console.log(`Could not resolve GitHub login for ${email}: ${error.message}`);
              }
              return undefined;
            };

            const commitsResponse = await github.rest.pulls.listCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              per_page: 100,
            });

            const assigneeCandidates = [];
            const seenLogins = new Set();
            const addCandidate = (login) => {
              if (!login || isBotLogin(login)) return;
              const key = login.toLowerCase();
              if (seenLogins.has(key)) return;
              seenLogins.add(key);
              assigneeCandidates.push(login);
            };

            for (const commit of commitsResponse.data) {
              for (const trailer of parseCoAuthorTrailers(commit.commit?.message || '')) {
                const login = await resolveLoginForEmail(trailer.email);
                addCandidate(login);
              }
            }

            // Human PR authors still get assigned when no co-author resolved.
            if (!isBotLogin(prAuthor)) {
              addCandidate(prAuthor);
            }

            const assignees = assigneeCandidates.slice(0, 1);
            // Never attribute the tracking issue to a bot when no human resolved.
            const attributedBy = assignees[0];
            const createdByLine = attributedBy
              ? `was created by @${attributedBy}`
              : 'did not identify a human author';

            // Construct the title and body for the new issue
            const issueTitle = `${prTitle}`;
            const issueBody = `> [!NOTE]
            > The pull request "[${prTitle}](${prUrl})" ${createdByLine} and did not reference an issue. Therefore this issue was created for better visibility in external tools like Linear.

            ${prBody}
            `;

            // Create the issue using the GitHub API
            const newIssue = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody,
              ...(assignees.length > 0 ? { assignees } : {}),
              labels: [
                'autocreated'
              ]
            });

            const issueID = newIssue.data.number;
            console.log(`Created issue #${issueID}${assignees.length ? ` assigned to @${assignees[0]}` : ' with no assignee'}.`);

            // Update the PR body to reference the new issue
            const updatedPrBody = `${prBody}\n\nCloses #${issueID}`;

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              body: updatedPrBody
            });

            console.log(`Updated PR #${prNumber} to reference newly created issue #${issueID}.`);
