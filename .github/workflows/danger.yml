name: Danger

on:
  pull_request:
    types: [
      opened,
      synchronize,
      reopened,
      edited,
      ready_for_review,
      labeled,
      unlabeled,
      converted_to_draft,
    ]

# Concurrency configuration:
# - We use workflow-specific concurrency groups to prevent multiple Danger runs on the same PR,
#   as Danger performs PR validation and comment generation that should be based on the latest code.
# - We always cancel in-progress runs since this workflow only runs on pull requests, and only
#   the latest commit's validation results matter for providing accurate PR feedback and reviews.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-full-ci-gate:
    name: CI eligibility
    uses: ./.github/workflows/run-full-ci-workflow.yml

  danger:
    needs: run-full-ci-gate
    if: needs.run-full-ci-gate.outputs.run_ci == 'true'
    name: Danger
    runs-on: ubuntu-latest
    steps:
      - uses: getsentry/github-workflows/danger@959162c159b866489d3fabe93327f48f9b8cb7ee # v3
