name: Build XCFramework Slice

on:
  workflow_call:
    inputs:
      sdk-list:
        description: |-
          The list of Apple platform SDKs for which to build slices and assemble into an XCFramework. This must be a JSON array of strings, itself in a string since GitHub Actions doesn't support arrays as inputs.
          Possible values: iphoneos, iphonesimulator, macosx, appletvos, appletvsimulator, watchos, watchsimulator, xros, xrsimulator.
        required: false
        default: '["iphoneos", "iphonesimulator", "macosx", "maccatalyst", "appletvos", "appletvsimulator", "watchos", "watchsimulator", "xros", "xrsimulator"]'
        type: string

      name:
        description: |-
          The Sentry project scheme to build an XCFramework slice for.
          Possible values: Sentry, SentryV10 (requires sdk-v10).
        required: true
        type: string

      sdk-v10:
        description: |-
          Whether to build the V10 SDK. Builds the SentryV10 scheme with Xcode 26, the oldest Xcode
          major V10 supports, and audits the slice for SentryCrash recorder objects.
        required: false
        type: boolean
        default: false

      suffix:
        description: |-
          The suffix to add to the build product name.
          E.g. "-Dynamic" or "-WithoutUIKitOrAppKit".
        required: false
        type: string

      macho-type:
        description: |-
          The Mach-O type of the build product.
          Possible values: mh_dylib, staticlib, inherit (use the target's xcconfig, required for dynamic V10 slices).
        required: false
        type: string
        default: "mh_dylib"

      configuration-suffix:
        description: |-
          The suffix to add to the build product name to build an alternate configuration of the target.
          E.g. "WithoutUIKit".
        required: false
        type: string

      variant-id:
        description: |-
          The ID of the variant to build an XCFramework slice for. Used to collect appropriate slices for final deliverable assembly.
        required: true
        type: string

      release-version:
        description: |-
          For release workflows, the version to inject into the SDK.
        required: false
        type: string
    secrets:
      GIT_SSH_PRIVATE_KEY_BASE64:
        required: false
      GIT_SSH_KEY_PASSPHRASE:
        required: false

jobs:
  build-xcframework-variant-slices:
    name: ${{matrix.sdk}}

    # We must compile this on an arm64 runner, cause it's required for visionOS. macos-15 and macos-26 use arm64.
    # To see the available runners see https://docs.github.com/en/actions/using-github-hosted-runners/using-github-hosted-runners/about-github-hosted-runners#standard-github-hosted-runners-for-public-repositories.
    runs-on: ${{ inputs.sdk-v10 && 'macos-26' || 'macos-15' }}

    strategy:
      matrix:
        sdk: ${{ fromJson(inputs.sdk-list) }}

    steps:
      # === Checkout and independent preparation ===
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Git access
        uses: ./.github/actions/setup-git-access
        with:
          ssh-key-base64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
          ssh-key-passphrase: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}

      # === Toolchain and simulator preparation ===
      # We use Xcode 16 (latest installed minor) for building V9 XCFrameworks and Xcode 26 for V10.
      # The setup-xcode action picks the newest minor available on the runner image.
      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode
        with:
          version: ${{ inputs.sdk-v10 && '26' || '16' }}
          resolve-simulators: "false"
      - name: Warm CoreSimulator
        id: warm-coresimulator
        background: true
        continue-on-error: true
        run: xcrun simctl list runtimes -j > /dev/null

      - name: Get version
        id: get-version
        env:
          GITHUB_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.release-version }}
        run: |
          if [ -n "$RELEASE_VERSION" ]; then
            echo "VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          else
            echo "VERSION=$(grep MARKETING_VERSION Sources/Configuration/Versioning.xcconfig | cut -d ' ' -f 3)+$GITHUB_SHA" >> "$GITHUB_ENV"
          fi
        shell: sh

      - name: Bump version
        env:
          VERSION: ${{ env.VERSION }}
        run: ./scripts/bump-version.sh --version "$VERSION"

      # === Build and validation ===
      - name: Wait for CoreSimulator warmup
        wait: warm-coresimulator

      - name: Build ${{inputs.name}}${{inputs.suffix}} XCFramework slice for ${{matrix.sdk}}
        if: ${{ !inputs.sdk-v10 }}
        env:
          MATRIX_SDK: ${{ matrix.sdk }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
          INPUT_MACHO_TYPE: ${{ inputs.macho-type }}
          INPUT_CONFIG_SUFFIX: ${{ inputs.configuration-suffix }}
        run: ./scripts/build-xcframework-slice.sh --sdk "$MATRIX_SDK" --scheme "$INPUT_NAME" --suffix "$INPUT_SUFFIX" --mach-o-type "$INPUT_MACHO_TYPE" --configuration-suffix "$INPUT_CONFIG_SUFFIX"
        shell: bash

      # The script owns the SentryV10 scheme, ReleaseV10 configuration and per-SDK architectures,
      # and archives to the same path layout as the step above.
      - name: Build V10 ${{inputs.name}}${{inputs.suffix}} XCFramework slice for ${{matrix.sdk}}
        if: ${{ inputs.sdk-v10 }}
        env:
          MATRIX_SDK: ${{ matrix.sdk }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
          INPUT_MACHO_TYPE: ${{ inputs.macho-type }}
        run: ./scripts/build-xcframework-v10.sh --sdks "$MATRIX_SDK" --suffix "$INPUT_SUFFIX" --mach-o-type "$INPUT_MACHO_TYPE" --slices-only
        shell: bash

      # the upload action broke symlinks in the mac sdk slice's xcarchive
      - name: Zip xcarchive
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_SUFFIX: ${{ inputs.suffix }}
          MATRIX_SDK: ${{ matrix.sdk }}
        run: |
          ditto -c -k -X --rsrc --keepParent "$GITHUB_WORKSPACE/XCFrameworkBuildPath/archive/$INPUT_NAME$INPUT_SUFFIX/$MATRIX_SDK.xcarchive" "$INPUT_NAME$INPUT_SUFFIX.xcarchive.zip"
        shell: bash

      # === Artifacts and diagnostics ===
      - name: Upload xcarchive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: xcframework-${{inputs.variant-id}}-slice-${{matrix.sdk}}
          if-no-files-found: error
          path: |
            ${{inputs.name}}${{inputs.suffix}}.xcarchive.zip

      - name: Upload build log if failed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ failure() || cancelled() }}
        with:
          name: raw-build-output-build-xcframework-${{inputs.variant-id}}-${{matrix.sdk}}
          path: |
            *.log

      - name: Run CI Diagnostics
        uses: ./.github/actions/ci-diagnostics
        if: failure()
