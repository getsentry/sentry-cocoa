name: Build XCFramework Variant

# Builds the slices of one release slice ID and assembles every variant made from them.
#
# The release workflow calls this once per slice ID, so each variant's assembly depends only on
# its own slices. A fast variant, such as WithoutUIKitOrAppKit, no longer waits for the slowest
# slice of an unrelated variant, and assembly jobs reach the runner queue as slices finish.
on:
  workflow_call:
    inputs:
      slice:
        description: |-
          A JSON object describing the slice to build, as generated by scripts/generate_release_matrix.sh.
          Keys: name, id, and optionally suffix, macho-type, configuration-suffix, sdk-v10.
        required: true
        type: string

      variants:
        description: |-
          A JSON array of the variants to assemble from the slice, as generated by scripts/generate_release_matrix.sh.
          Each variant must have the same id as the slice.
        required: true
        type: string

      sdk-list-array:
        description: |-
          The SDKs to build slices for, as a JSON array of strings.
        required: true
        type: string

      sdk-list-string:
        description: |-
          The SDKs to assemble into each XCFramework, as a comma-separated string.
        required: true
        type: string

      signed:
        description: |-
          Whether or not the assembled XCFrameworks should be signed.
        required: false
        type: boolean
        default: false

      release-version:
        description: |-
          For release workflows, the version to inject into the SDK.
        required: false
        type: string
    secrets:
      GIT_SSH_PRIVATE_KEY_BASE64:
        required: false
      GIT_SSH_KEY_PASSPHRASE:
        required: false
      FASTLANE_KEYCHAIN_PASSWORD:
        required: false
      MATCH_GIT_PRIVATE_KEY:
        required: false
      MATCH_PASSWORD:
        required: false
      MATCH_USERNAME:
        required: false

jobs:
  build-slices:
    name: Build Slices
    uses: ./.github/workflows/build-xcframework-variant-slices.yml
    secrets:
      GIT_SSH_PRIVATE_KEY_BASE64: ${{ secrets.GIT_SSH_PRIVATE_KEY_BASE64 }}
      GIT_SSH_KEY_PASSPHRASE: ${{ secrets.GIT_SSH_KEY_PASSPHRASE }}
    with:
      name: ${{ fromJson(inputs.slice).name }}
      suffix: ${{ fromJson(inputs.slice).suffix }}
      macho-type: ${{ fromJson(inputs.slice).macho-type }}
      configuration-suffix: ${{ fromJson(inputs.slice).configuration-suffix }}
      variant-id: ${{ fromJson(inputs.slice).id }}
      sdk-v10: ${{ fromJson(inputs.slice).sdk-v10 == true }}
      release-version: ${{ inputs.release-version }}
      sdk-list: ${{ inputs.sdk-list-array }}

  assemble:
    name: Assemble
    needs: build-slices
    uses: ./.github/workflows/assemble-xcframework-variant.yml
    secrets:
      FASTLANE_KEYCHAIN_PASSWORD: ${{ secrets.FASTLANE_KEYCHAIN_PASSWORD }}
      MATCH_GIT_PRIVATE_KEY: ${{ secrets.MATCH_GIT_PRIVATE_KEY }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_USERNAME: ${{ secrets.MATCH_USERNAME }}
    with:
      scheme: ${{ matrix.variant.scheme }}
      suffix: ${{ matrix.variant.suffix }}
      configuration-suffix: ${{ matrix.variant.configuration-suffix }}
      variant-id: ${{ matrix.variant.id }}
      signed: ${{ inputs.signed }}
      release-version: ${{ inputs.release-version }}
      excluded-archs: ${{ matrix.variant.excluded-archs }}
      override-name: ${{ matrix.variant.override-name }}
      sdks: ${{ inputs.sdk-list-string }}
    strategy:
      matrix:
        variant: ${{ fromJson(inputs.variants) }}
