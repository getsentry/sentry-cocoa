name: "Set up Xcode"
description: >-
  Selects an Xcode version (latest, major, major.minor, or exact) and exposes
  the resolved Xcode version plus the simulator OS that ships with that Xcode
  for each platform (iOS/tvOS/watchOS/visionOS). The same values are exported
  to `$GITHUB_ENV` (XCODE_VERSION, IOS_SIMULATOR_OS, TVOS_SIMULATOR_OS,
  WATCHOS_SIMULATOR_OS, VISIONOS_SIMULATOR_OS) so the Makefile and downstream
  scripts pick them up automatically. For device name resolution, use the
  `resolve-test-destination` action.
inputs:
  version:
    description: >-
      Xcode version specifier. Accepts 'latest', a major like '16' or '26',
      a major.minor like '16.4' or '26.0', or an exact installed version.
    required: false
    default: "latest"
  allow-prerelease:
    description: >-
      When 'true', include prerelease (beta/RC/GM) Xcode versions during
      resolution. By default prerelease versions are filtered out.
    required: false
    default: "false"
  resolve-simulators:
    description: >-
      When 'true' (default), query simulator runtimes and resolve per-platform
      simulator OS versions. Set to 'false' for build-only or lint jobs that
      don't need simulator destinations — skips the expensive simctl calls.
    required: false
    default: "true"
outputs:
  xcode-version:
    description: "The resolved (concrete) Xcode version, e.g. '16.4' or '26.0.1'."
    value: ${{ steps.select.outputs.xcode-version }}
  ios-simulator-os:
    description: "iOS simulator OS version that ships with the selected Xcode."
    value: ${{ steps.select.outputs.ios-simulator-os }}
  tvos-simulator-os:
    description: "tvOS simulator OS version that ships with the selected Xcode."
    value: ${{ steps.select.outputs.tvos-simulator-os }}
  watchos-simulator-os:
    description: "watchOS simulator OS version that ships with the selected Xcode."
    value: ${{ steps.select.outputs.watchos-simulator-os }}
  visionos-simulator-os:
    description: "visionOS simulator OS version that ships with the selected Xcode."
    value: ${{ steps.select.outputs.visionos-simulator-os }}
runs:
  using: "composite"
  steps:
    - name: Select Xcode and export simulator versions
      id: select
      shell: bash
      env:
        XCODE_INPUT: ${{ inputs.version }}
        ALLOW_PRERELEASE: ${{ inputs.allow-prerelease }}
        RESOLVE_SIMULATORS: ${{ inputs.resolve-simulators }}
      run: |
        PRERELEASE_FLAG=""
        if [[ "$ALLOW_PRERELEASE" == "true" ]]; then
          PRERELEASE_FLAG="--allow-prerelease"
        fi
        SKIP_SIMULATORS_FLAG=""
        if [[ "$RESOLVE_SIMULATORS" == "false" ]]; then
          SKIP_SIMULATORS_FLAG="--skip-simulators"
        fi
        "${{ github.action_path }}/../../../scripts/ci-select-xcode.sh" $PRERELEASE_FLAG $SKIP_SIMULATORS_FLAG "$XCODE_INPUT"
