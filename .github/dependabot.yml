version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # An empty list also disables Dependabot's default labels.
    labels: []
    ignore:
      - dependency-name: fastlane
        versions:
          - 2.179.0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels: []

  - package-ecosystem: "swift"
    directory: "/test-server"
    schedule:
      interval: weekly
    labels: []

  - package-ecosystem: "swift"
    directory: "/TestApps/macOS-CLI"
    schedule:
      interval: weekly
    labels: []
