version: 2
updates:
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    labels:
      - "run-full-ci"
      - "dependencies"
    ignore:
      - dependency-name: fastlane
        versions:
          - 2.179.0

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - "run-full-ci"
      - "dependencies"

  - package-ecosystem: "swift"
    directory: "/test-server"
    schedule:
      interval: weekly
    labels:
      - "run-full-ci"
      - "dependencies"

  - package-ecosystem: "swift"
    directory: "/Samples/macOS-CLI"
    schedule:
      interval: weekly
    labels:
      - "run-full-ci"
      - "dependencies"
