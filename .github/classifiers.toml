# getsentry/sentry-cocoa ebbc5f1d5119bd1badccf58b6c7b2320aa8cbe49

rubric = "sdk"

# Root Package*.swift are the Swift Package Manager manifests customers resolve.
[[area]]
paths = ["Sources/**", "3rd-party-integrations/**", "distribution/**", "Package*.swift"]
families = ["mobile-native"]

[[kind]]
paths = ["sdk_api*.json"]
kind = "public-api-record"

[[kind]]
paths = ["Sources/SentryCrash/**", "Sources/Sentry/KSCrash/**"]
kind = "dependencies"

[[kind]]
paths = [
  "Package*.swift", "**/Package.swift", "**/*.podspec", "Sentry.xcodeproj/**", "Sentry.xcworkspace/**",
  "Makefile", "fastlane/**", "scripts/**", "Utils/**", ".craft.yml", "Gemfile*", "Brewfile*",
  ".ruby-version", ".swiftpm/**", "Sources/Configuration/**", "Sources/Resources/**",
  "distribution/**", "schema/**",
]
kind = "build-release"

[[kind]]
paths = [
  "Tests/**", "SentryTestUtils*/**", "test-server/**", "Sources/SentryDistributionTests/**",
  "3rd-party-integrations/*/Tests/**", "Plans/**", "SentryTests-Info.plist",
]
kind = "tests"

[[kind]]
paths = ["TestApps/**"]
kind = "samples"

[[kind]]
paths = [
  "develop-docs/**", "docs/**", "3rd-party-integrations/*/Sources/*.docc/**", "sentry-spec-compliance.json",
]
kind = "docs"

[[kind]]
paths = [
  "linters/**", "skills/**", ".clang-format",
  ".swiftlint.yml", "Utils/VersionBump/.swiftlint.yml", "dprint.json", ".markdownlint-cli2.jsonc",
  ".spi.yml", "3rd-party-integrations/*/.spi.yml",
  ".git-blame-ignore-revs", "agents.toml",
]
kind = "dev-tooling"
